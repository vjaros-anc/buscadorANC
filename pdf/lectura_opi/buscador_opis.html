 la «empresa» objeto no registró actividad en el país en el último año, encuadrando en la excepción del art. 11 inc. d) de la Ley 27.442; además sostienen que no hay concentración real porque la cesión fue una dación en pago y se transferirá luego a un tercero mediante licitación.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "La operación consistente en la cesión por GAS Y PETRÓLEO a IEASA de su participación (50%) en la concesión de explotación del área «Aguada del Chañar» se encuentra sujeta a la obligación de notificación del Artículo 9° de la Ley 27.442; la concesión de explotación no convencional otorgada por Decreto N° 1605/18 no se encuentra sujeta a dicha obligación.", "medidas_accesorias": "concesión de explotación no convencional otorgada por decreto provincial declarada no sujeta a notificación por no constituir concentración económica", "CAUSA_ratio_decidendi": "La excepción del art. 11 inc. d) no aplica porque las actividades de la empresa objeto (explotación y transporte de hidrocarburos) y de la adquirente son coincidentes, y además el área cedida posee reservas explotables cuya producción será reanudada, lo que evidencia que se transfiere un activo productivo y notificable en los términos del art. 7 inc. d).", "causa_criterio": "otro", "hecho_determinante": "El área cedida posee reservas hidrocarburíferas explotables y la adquirente afirma que reanudará la producción mediante un futuro cesionario, lo que demuestra que el objeto transferido es un activo productivo; además las actividades de la empresa objeto y de IEASA son coincidentes, lo que excluye la salvedad invocada del art. 11 inc. d).", "fundamento_normativo": "Ley 27.442 art. 11 inc. d | Ley 27.442 art. 9 | Ley 27.442 art. 7 inc. d", "precedentes": "OPI 83", "parrafos": "20 | 21 | 22 | 23 | 24", "confianza": "alta", "alertas_automaticas": "criterio = otro ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. d", "Ley 27.442 art. 9", "Ley 27.442 art. 7 inc. d"]}, {"OPI": "324", "archivo": "OPI-324.pdf", "expediente": "EX-2019-04741621- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se requirió opinión consultiva respecto de la obligación de notificar la operación consistente en la adquisición del control conjunto indirecto sobre TERMINALS FINANCE B.V. y VTTI B.V. por parte de IFM INVESTORS PTY LTD, en los términos del Art. 10 de la Ley N° 27.442.", "argumento_consultante": "Las partes sostuvieron dos argumentos: (i) el volumen de negocios de las empresas afectadas resultaría inferior al umbral legal, y (ii) IFM revestiría el carácter de «new comer» o «first landing», encuadrando en la excepción del Art. 11 inc. (c) de la Ley 27.442.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta, consistente en la adquisición del control conjunto indirecto sobre TERMINALS FINANCE B.V. y VTTI B.V. por parte de IFM INVESTORS PTY LTD, no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9 de la Ley Nº 27.442, conforme lo previsto en el Artículo 11, inciso (c), de la referida norma.", "medidas_accesorias": "confidencialidad_concedida | eximicion_de_traduccion_legalizada", "CAUSA_ratio_decidendi": "IFM no poseía previamente activos ni acciones de empresas en Argentina, ni exportaciones significativas en los últimos 36 meses. Su participación del 50% en TF HOLDCO no le otorgaba control sobre esa sociedad ni, por ende, sobre VTTI, por lo que dicha tenencia previa no constituye un impedimento para aplicar la excepción de «first landing».", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "IFM, a través de su subsidiaria LUXPOORT, era titular indirecto del 50% de TF HOLDCO pre-transacción, pero sin derechos de gobierno que le otorgaran control sobre esa sociedad ni sobre VTTI, careciendo de activos, acciones o exportaciones significativas hacia la Argentina.", "fundamento_normativo": "Ley 27.442 art. 11 inc. c", "precedentes": "Opinión Consultiva N° 73/2000 | Dictamen CNDC 1398/16", "parrafos": "32 | 33 | 34 | 35", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. c"]}, {"OPI": "325", "archivo": "OPI-325.pdf", "expediente": "EX-2019-19160805- -APN-DGD#MPYT", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "WADE consulta si la operación de compraventa de activos de PROTEINSA (adquiridos en la quiebra de RASIC HERMANOS) debe ser notificada como concentración económica, dado que el importe comprometido no estaba firmemente determinado, y si el plazo de notificación se iniciaría con la inscripción registral de los principales activos; sostiene además que la operación estaría exenta por no superar el volumen mínimo del Art. 9 de la Ley 27.442.", "argumento_consultante": "El importe de la operación (USD 77.818.974, equivalente a $1.588.285.260 al tipo de cambio de marzo 2018) no superaba el monto mínimo de cien millones de unidades móviles ($2.000.000.000) vigente al momento de celebrarse el contrato, por lo que la operación estaría exenta de notificación obligatoria.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta, consistente en la Compraventa de la totalidad de los activos que PROTEINSA S.A. había adquirido en la quiebra de RASIC HERMANOS S.A., por parte de WADE S.A., se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "multa", "CAUSA_ratio_decidendi": "La consultante confundió el monto de la operación con el volumen de negocios total del conjunto de empresas afectadas, el cual —sumando WADE, su grupo económico y PROTEINSA— ascendió a $16.931.071.650,60, superando ampliamente el umbral de cien millones de unidades móviles del Art. 9. Además, la operación no encuadra en la excepción del Art. 11 inciso e) por superar los montos allí previstos.", "causa_criterio": "umbral_de_volumen_no_alcanzado | otro", "hecho_determinante": "El volumen de negocios total del conjunto de empresas afectadas (WADE, su grupo HAISA y PROTEINSA) para el año 2018 ascendió a $16.931.071.650,60, muy por encima del umbral de cien millones de unidades móviles, y la operación tampoco encuadra en la excepción del Art. 11 inc. e) por exceder los montos allí fijados.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. e | Ley 27.442 art. 7 inc. d", "precedentes": "", "parrafos": "39 | 46 | 47", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 7 inc. d"]}, {"OPI": "326", "archivo": "OPI-326.pdf", "expediente": "EX-2019-13952534- APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si las materias reguladas en los incisos (d), (g) y (m) del artículo 5.2. del contrato de compraventa y acuerdo de accionistas entre IRSA y SOCHO, sujetas a un derecho de bloqueo del socio minoritario, poseen relevancia competitiva y si su extinción, al adquirir IRSA el 20% restante de HASA, implica un cambio en la naturaleza del control.", "argumento_consultante": "La consultante entiende que, salvo por los incisos (d), (g) y (m) sobre los que tiene dudas, la extinción del acuerdo de accionistas no configuraría un cambio en la naturaleza del control, ya que las demás materias carecen de relevancia competitiva.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al Señor SECRETARIO DE COMERCIO INTERIOR disponer que la operación traída a consulta, que consiste en la adquisición por parte de IRSA de las acciones en poder de SOCHO de HASA representativas del veinte por ciento (20%) de su capital social, no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442, por encuadrar en la excepción prevista en el inciso a) del artículo 11 de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Los derechos de veto del socio minoritario sobre los incisos (d), (g) y (m) nunca fueron ejercidos con incidencia real en la gestión de la empresa (el tema del inciso d nunca se trató, los directores renunciaron a honorarios del inciso g, y la no distribución de dividendos del inciso m obedeció a pérdidas), por lo que no habilitaban influencia sobre la estrategia competitiva de HASA y su extinción no altera la naturaleza del control preexistente.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "Las materias de los incisos (d), (g) y (m) del acuerdo de accionistas no fueron tratadas o no tuvieron aplicación efectiva en la práctica societaria de HASA, careciendo de incidencia en la estrategia competitiva de la empresa.", "fundamento_normativo": "Ley 27.442 art. 11 inc. a", "precedentes": "OPI 124", "parrafos": "17 | 18 | 19 | 20 | 21 | 22 | 23", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. a"]}, {"OPI": "327", "archivo": "OPI-327.pdf", "expediente": "EX-2019-42099872- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Los consultantes preguntan si la adquisición por LIMONEIRA del 51% de las parcelas de la finca citrícola de TRAPANI, mediante un Joint Venture (TRAPANI FRESH), se encuentra sujeta a notificación obligatoria, alegando por un lado que no se alcanza el umbral de volumen de negocios, y subsidiariamente que aplicaría la excepción de First Landing del art. 11 inc. c).", "argumento_consultante": "La transacción no supera el umbral de volumen de negocios del art. 9°, y subsidiariamente resulta aplicable la excepción de First Landing (art. 11 inc. c) de la Ley 27.442), pues LIMONEIRA es una sociedad extranjera que no poseía previamente activos ni acciones de empresas en Argentina.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "LIMONEIRA, siendo una sociedad extranjera, no poseía previo a la operación activos ni acciones de empresas en la Argentina, cumpliendo así el requisito esencial de la excepción de First Landing, por lo que no existe posibilidad de efectos anticompetitivos derivados de reforzar una participación de mercado preexistente.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "LIMONEIRA no tenía activos ni acciones de empresas en Argentina antes de la operación con TRAPANI, siendo su único contacto previo con el mercado local la importación de producción citrícola.", "fundamento_normativo": "Ley 27.442 art. 11 inc. c", "precedentes": "OPI 283 | OPI 287", "parrafos": "25 | 26 | 27 | 28 | 29", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. c"]}, {"OPI": "328", "archivo": "OPI-328.pdf", "expediente": "EX-2019-65548155- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Si la adquisición de control exclusivo por parte de MARCOPOLO S.A. sobre INVERSIONES LOMA HERMOSA S.A. e indirectamente sobre METALSUR CARROCERÍAS S.A. se encontraría exenta de la obligación de notificación conforme al inciso e) del Artículo 11 de la Ley 27.442.", "argumento_consultante": "Las partes sostuvieron que el monto de la operación y el valor de los activos en Argentina (considerando únicamente a METALSUR) se encontraban por debajo del umbral de 20.000.000 de unidades móviles, y que no habían realizado operaciones de concentración en los últimos 36 meses.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta, consiste en la adquisición de control exclusivo sobre INVERSIONES LOMA HERMOSA S.A. e indirectamente sobre METALSUR CARROCERÍAS S.A. por parte de MARCOPOLO S.A., se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El valor contable del activo de LOMA HERMOSA, empresa objeto de la operación, asciende a $570.260.765, superando por sí solo el tope legal de $528.000.000 previsto en el inciso e) del artículo 11. Al no cumplirse este requisito (que es uno de los tres exigidos de forma concurrente), la exención resulta inaplicable, sin necesidad de analizar los restantes recaudos.", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "El valor contable del activo de LOMA HERMOSA ($570.260.765) supera el tope legal de $528.000.000 (20.000.000 de unidades móviles), lo que impide la aplicación de la exención del artículo 11 inciso e).", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9", "precedentes": "", "parrafos": "21 | 22 | 23 | 24", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "329", "archivo": "OPI-329.pdf", "expediente": "EX-2019-68034834- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "El consultante entiende que la operación de concentración económica descripta no se encuentra alcanzada por la obligación de notificar establecida en el Art. 9 de la Ley N° 27.442, dado que el volumen de negocio total del conjunto de empresas afectadas no supera en el país la suma equivalente a cien millones (100.000.000) de unidades móviles.", "argumento_consultante": "El volumen de negocios de las firmas afectadas por la operación no supera el umbral de cien millones de unidades móviles establecido en el Art. 9 de la LDC.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta, consistente en la adquisición, por parte de CONOCOPHILLIPS ARGENTINA VENTURES S.R.L., de un porcentaje de participación equivalente al 45% en la concesión de explotación no convencional «Aguada Federal» y de un porcentaje de participación equivalente al 50% en la concesión de explotación no convencional «Bandurria Norte», no se encuentra sujeta a la obligación de notificación establecida en el Art. 9 de la Ley Nº 27.442.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "El volumen de negocios generado por los activos transferidos (las participaciones en «Aguada Federal» y «Bandurria Norte») sumado al del grupo adquirente se encuentra sensiblemente por debajo del umbral de cien millones de unidades móviles fijado por el Art. 9 de la LDC, dado que COP ARG no produce ni vende hidrocarburos en el país y las áreas objeto de la transacción registraron ventas netas muy inferiores al umbral vigente.", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "Las ventas netas de las áreas transferidas en 2018 ($583.596.439,96) sumadas a la nula facturación de COP ARG en Argentina resultan muy inferiores al umbral de 100.000.000 de unidades móviles ($2.640.000.000 según Res. SCI 145/2019).", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 85", "precedentes": "", "parrafos": "19 | 20 | 21 | 22 | 23", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 85"]}, {"OPI": "330", "archivo": "OPI-330.pdf", "expediente": "EX-2019-68049237- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "El consultante refirió que entiende que la operación en cuestión estaría exenta de la notificación prevista en el art. 9° de la Ley N° 27.442, por cuanto se subsumiría en el inciso a) del artículo 11 de la citada ley.", "argumento_consultante": "TELECOM ya ejercía el control sobre LA CAPITAL CABLE S.A. en virtud de los derechos que le otorgaba el Convenio de Accionistas suscripto en mayo de 1996, aunque no poseía más del 50% de las acciones, por lo que la adquisición del 50% restante no implicaría un cambio de control.", "respuesta_sentido": "otro", "respuesta_texto": "a) Tener por no presentado el pedido de opinión consultiva en trámite por EX-2019-68049237- -APN-DGD#MPYT, en virtud de lo dispuesto por el punto a.3) del Anexo a la Resolución N° 26 de fecha 12 de julio de 2006 de la ex SECRETARÍA DE COORDINACIÓN TÉCNICA; y b) Disponer la apertura de una Diligencia Preliminar a fin de determinar si la operación objeto de la presente consulta encuadra en los términos de la Ley N° 27.442 y se encuentra sujeta a la notificación obligatoria dispuesta por el artículo 9° de la misma.", "medidas_accesorias": "apertura_diligencia_preliminar", "CAUSA_ratio_decidendi": "El texto no desarrolla en la sección ANÁLISIS (consignada como 'sin datos') la fundamentación sustantiva de la decisión; la CNDC solo invoca el punto a.3) del Anexo de la Resolución N° 26/2006 como base procesal para no expedirse por vía de opinión consultiva y en cambio abrir una diligencia preliminar.", "causa_criterio": "otro", "hecho_determinante": "El cierre de la operación se produjo el 24 de julio de 2019, es decir, con anterioridad a la respuesta de la opinión consultiva, lo que motivó que la CNDC decidiera no expedirse por esa vía y en su lugar abrir una diligencia preliminar para evaluar si correspondía la notificación obligatoria.", "fundamento_normativo": "Resolución N° 26/2006 art. Anexo, punto a.3 | Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. a", "precedentes": "", "parrafos": "18", "confianza": "baja", "alertas_automaticas": "criterio = otro ; confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Resolución N° 26/2006 art. Anexo, punto a.3", "Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. a"]}, {"OPI": "331", "archivo": "OPI-331.pdf", "expediente": "EX-2018-17681565- -APN-DGD#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "El consultante entiende que la operación de concentración económica descripta —adquisición por IBM de todas las acciones de RED HAT— no se encuentra alcanzada por la obligación de notificar del Art. 9 de la LDC, dado que resulta aplicable la excepción de minimis del artículo 11 inciso e).", "argumento_consultante": "El monto de la operación y el valor de los activos locales de RED HAT no superan el umbral de 20.000.000 de unidades móviles previsto en el artículo 11 inciso e) de la LDC, por lo que aplicaría la excepción de minimis.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta, consistente en la adquisición, por parte de INTERNATIONAL BUSINESS MACHINES CORPORATION de todas las acciones comunes emitidas y a emitirse de RED HAT, INC. se encuentra sujeta a la obligación de notificar estipulado por el artículo 9 de la Ley N° 27.442.", "medidas_accesorias": "remision | apertura_de_expediente_de_concentraciones | eximicion_de_traduccion_publica", "CAUSA_ratio_decidendi": "Al no haber asignado las partes un monto local a la operación, la CNDC calculó la porción argentina del precio de compra aplicando el cociente entre la facturación argentina y la facturación global del negocio adquirido sobre el monto total de la transacción, resultando un valor muy superior al umbral de 20.000.000 de unidades móviles, por lo que no resulta aplicable la excepción de minimis.", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "El monto de la operación en Argentina no fue asignado por las partes al momento del cierre, por lo que la CNDC estimó la porción local del precio de compra mediante un enfoque histórico (ratio de facturación local sobre global aplicado al monto total), obteniendo un valor de $8.292.928.000, muy superior al tope de 20.000.000 de unidades móviles ($528.000.000).", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. e | Ley 27.442 art. 85", "precedentes": "OPI 187 | OPI 311", "parrafos": "18 | 19 | 21", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 85"]}, {"OPI": "332", "archivo": "OPI-332.pdf", "expediente": "EX-2019-70658710- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Los consultantes preguntan si la fusión por absorción de DASS ELDORADO por DASS ARGENTINA, ambas controladas por DASS NORDESTE, se encuentra alcanzada por el deber de notificar.", "argumento_consultante": "No se produce cambio de control ya que ambas empresas se encontraban bajo el control directo de DASS NORDESTE tanto antes como después de la operación, encuadrando en la exención del art. 11 inc. a) de la Ley 27.442.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO INTERIOR disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "DASS ARGENTINA y DASS ELDORADO ya se encontraban controladas de forma directa por DASS NORDESTE e indirectamente por BLU LICENCIAMIENTOS antes de la operación, y ese mismo controlante final continúa siéndolo después de la fusión, por lo que se trata de una reorganización societaria sin toma de control.", "causa_criterio": "reorganizacion_intragrupo_sin_cambio_de_control", "hecho_determinante": "La fusión por absorción de DASS ELDORADO por DASS ARGENTINA se da entre empresas que ya estaban bajo el control común de DASS NORDESTE, sin alteración de la estructura de control final del grupo.", "fundamento_normativo": "Ley 27.442 art. 11 inc. a | Ley 27.442 art. 9 | Ley 27.442 art. 7", "precedentes": "OPI 41 | OPI 48 | OPI 79 | OPI 138", "parrafos": "19 | 20", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. a", "Ley 27.442 art. 9", "Ley 27.442 art. 7"]}, {"OPI": "333", "archivo": "OPI-333.pdf", "expediente": "EX-2019-95215430- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Las partes consultan si la operación por la cual LAMB WESTON y SCP pasan a ser titulares en conjunto del 100% del capital social y votos de AMSA (mediante la compra de acciones de SDM e IN y un posterior aumento de capital suscripto por LAMB WESTON) se encuentra exenta de notificación obligatoria, y si la transacción simultánea entre SCP e IN implica una concentración económica.", "argumento_consultante": "LAMB WESTON, previo al cierre de la operación, no tenía presencia en Argentina (sin acciones en otras empresas, exportaciones ni activos), por lo que la adquisición de control conjunto sobre AMSA encuadraría en la excepción de «first landing» del Art. 11 inc. c) de la Ley 27.442. Además, la operación entre SCP e IN no constituiría una concentración porque IN ya ejercía control de facto sobre SCP.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja a la SEÑORA SECRETARIA DE COMERCIO INTERIOR disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "LAMB WESTON no poseía, previo a la operación, activos ni acciones de empresas en Argentina, por lo que su adquisición de control conjunto sobre AMSA encuadra en la excepción de «first landing». La norma busca excluir operaciones donde una empresa extranjera sin presencia previa en el país solo reemplaza al dueño de una empresa, sin poder reforzar una participación de mercado inexistente.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "LAMB WESTON no tenía, previo al cierre de la transacción, acciones en otras empresas constituidas en Argentina, exportaciones al país ni activos situados en Argentina.", "fundamento_normativo": "Ley 27.442 art. 11 inc. c", "precedentes": "", "parrafos": "37 | 38 | 39 | 40 | 41 | 44", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. c"]}, {"OPI": "334", "archivo": "OPI-334.pdf", "expediente": "EX-2020-91794468- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la adquisición por parte de CRWM del control de ALPARGATAS ARGENTINA y del Negocio Topper se encuentra exenta de la obligación de notificación del artículo 9° de la LDC por encuadrar en la excepción de first landing prevista en el artículo 11, inciso c).", "argumento_consultante": "CRWM no poseía previamente activos ni acciones de otras empresas en la Argentina, salvo un interés accionario indirecto en HUB PAGOS, sociedad que se encuentra inactiva desde su constitución y nunca realizó actividad económica en el país, por lo que la operación encuadraría en la excepción del art. 11 inc. c) de la Ley 27.442.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja a la SEÑORA SECRETARIA DE COMERCIO INTERIOR del MINISTERIO DE DESARROLLO PRODUCTIVO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Si bien CRWM poseía indirectamente, a través de HUB PREPAID, un interés en HUB PAGOS, sociedad radicada en Argentina, esa sociedad nunca desarrolló actividades económicas en el país (sin empleados, registros contables ni operaciones), por lo que no se configura el impedimento de haber poseído previamente activos o acciones operativas que excluiría la aplicación de la excepción de first landing.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "HUB PAGOS, sociedad argentina vinculada indirectamente a CRWM a través de HUB PREPAID, permaneció inactiva desde su constitución, sin empleados, registros comerciales o impositivos, ni estados contables.", "fundamento_normativo": "Ley 27.442 art. 11 inc. c", "precedentes": "", "parrafos": "20 | 21 | 22 | 23 | 24", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. c"]}, {"OPI": "335", "archivo": "OPI-335.pdf", "expediente": "EX-2020-56799884- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "La consultante sostiene que la operación —una serie de transacciones que incrementaron la participación accionaria de SBG en WW hasta aproximadamente el 51%— no conlleva un cambio de control ni una modificación en la naturaleza del control sobre WW, por lo que no estaría alcanzada por la obligación de notificar del artículo 9 de la Ley N.º 27.442.", "argumento_consultante": "Aunque SBG pasó a tener la mayoría absoluta de las acciones, sus derechos de voto están limitados al 49,99%, no tiene voto de desempate en el Directorio ni acuerdos que le otorguen derechos de veto sobre cuestiones estratégicas de WW.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley N.º 27.442, y se concede la confidencialidad solicitada respecto a la documentación acompañada como Anexo 1 – Confidencial.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "SBG adquirió influencia sustancial sobre WW porque, pese a la limitación de sus derechos de voto, ostenta la mayoría absoluta de las acciones frente a accionistas minoritarios muy dispersos, designa la mitad del Directorio, se convirtió en su principal acreedor financiero con asistencia continua, y ya cuenta con experiencia en la gestión de unidades empresariales, todo lo cual incrementa su gravitación en las decisiones de la empresa.", "causa_criterio": "otro", "hecho_determinante": "La combinación de mayoría accionaria absoluta con dispersión de los demás accionistas, la designación de la mitad del Directorio, el rol de SBG como principal acreedor financiero de WW con asistencia continua, y su experiencia previa como controlante de Brightstar Corp., configuran una adquisición de influencia sustancial en los términos del art. 7(c) de la Ley 27.442.", "fundamento_normativo": "Ley 27.442 art. 7 inc. c | Ley 27.442 art. 9", "precedentes": "", "parrafos": "15 | 16 | 17 | 18 | 19 | 22", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. c", "Ley 27.442 art. 9"]}, {"OPI": "336", "archivo": "OPI-336.pdf", "expediente": "EX-2020-56792839- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La consultante planteó que la adquisición por PCT LLC de la participación accionaria de WST S.A. en PEPCA S.A. (45,80% del capital social) no debía ser notificada por no calificar como concentración económica en los términos del artículo 7º inciso a) de la Ley N.º 27.442.", "argumento_consultante": "PCT no adquiere un control que no poseía, ya que se mantiene la estructura de control conjunto preexistente sobre PEPCA y CIESA, ejercida junto con GIP, sin que la operación otorgue nuevos derechos ni incremente su influencia.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja a la SECRETARIA DE COMERCIO INTERIOR disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La operación implica el paso de un control conjunto de tres socios (PCT, WST y GIP) a uno de dos socios (PCT y GIP), quienes ya debían actuar conjuntamente como un único accionista. No hay cambio relevante en la estructura de control de PEPCA ni de CIESA, ni incremento de influencia de PCT, por lo que no hay toma de control.", "causa_criterio": "control_ya_preexistente", "hecho_determinante": "PCT y GIP ya actuaban conjuntamente como un único accionista respecto de PEPCA y CIESA antes de la operación, por lo que la adquisición de la participación de WST solo redujo el número de socios del bloque de control sin alterar la estructura de control ni otorgar nuevos derechos a PCT.", "fundamento_normativo": "Ley 27.442 art. 7 inc. a | Ley 27.442 art. 9", "precedentes": "CONC. 1347 | OPI 246", "parrafos": "30 | 32 | 34 | 35", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. a", "Ley 27.442 art. 9"]}, {"OPI": "337", "archivo": "OPI-337.pdf", "expediente": "EX-2020-68167244- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si el acuerdo mediante el cual WHL adquirirá de NS hornos microondas fabricados por esta última, conforme especificaciones técnicas acordadas, constituye una operación de concentración económica sujeta a notificación.", "argumento_consultante": "Las partes sostienen que conservan total autonomía en sus negocios, no hay exclusividad, no se intercambia información sensible, no hay opción de compra de activos ni injerencia de NS en las políticas comerciales de WHL, por lo que no habría toma de control.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley N.° 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Se trata de una simple relación contractual de suministro (façón) sin exclusividad, sin opción de compra de activos ni instalaciones, sin injerencia de una parte en la estrategia comercial de la otra y sin intercambio de información sensible, por lo que no se transfiere un activo ni se otorga influencia determinante que configure toma de control.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El acuerdo es un contrato de suministro/façón por 48 meses, sin exclusividad, sin opción de compra de instalaciones, en el que ambas partes mantienen autonomía total sobre sus negocios, clientela y estrategias comerciales.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9 | Ley 27.442 art. 10", "precedentes": "OPI 904 | OPI 177", "parrafos": "27 | 28 | 29", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9", "Ley 27.442 art. 10"]}, {"OPI": "338", "archivo": "OPI-338.pdf", "expediente": "EX-2020-71437191- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si el acuerdo mediante el cual WHL adquirirá de PILISAR ciertas heladeras, fabricadas por esta última según especificaciones técnicas y patentes de WHL en la planta de PILISAR, se encuentra sujeto a notificación obligatoria.", "argumento_consultante": "El acuerdo es una simple relación contractual de suministro (façón), sin exclusividad, sin opción de compra de activos ni injerencia en la administración de la otra parte, por lo que no implicaría una toma de control.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley N.° 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El contrato es una relación de suministro/façón sin exclusividad, sin transferencia de activos que constituyan un negocio con clientela y valor propios, sin opción de compra de instalaciones ni injerencia de una parte en la administración o estrategia comercial de la otra, por lo que no se transfiere el control de una empresa.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El acuerdo de suministro de 48 meses no otorga exclusividad, no incluye opción de compra de la planta de PILISAR, no implica injerencia de PILISAR en las políticas comerciales de WHL ni de WHL en la administración de PILISAR, y cada parte mantiene su clientela, estrategia y control de negocio de forma independiente.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9 | Ley 27.442 art. 10", "precedentes": "OPI 904 | OPI 177", "parrafos": "24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9", "Ley 27.442 art. 10"]}, {"OPI": "339", "archivo": "OPI-339.pdf", "expediente": "EX-2021-17560891- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "La consultante solicitó se determine si la adquisición de control exclusivo e indirecto sobre FERRO ARGENTINA S.A., mediante compraventa de activos y acciones entre PIGMENTS SPAIN S.L. y FERRO CORPORATION, se encuentra exceptuada de la notificación obligatoria por aplicación de la excepción de minimis del artículo 11, inciso e) de la Ley 27.442.", "argumento_consultante": "El valor de los activos locales de FERRO ARGENTINA y el valor local de la transacción se encuentran por debajo del umbral de 20.000.000 de Unidades Móviles previsto en el artículo 11 inciso e), por lo que la operación quedaría exceptuada de notificación.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta CNDC aconseja disponer que la operación consultada no encuadra en la excepción prevista por el inciso e) del artículo 11 de la Ley N.° 27.442, y corresponde ser notificada conforme lo dispone el artículo 9 de la norma citada.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La consultante no acreditó el método utilizado para estimar el valor de los activos locales de 2020 ni acompañó balance o certificación contable que respalde esa estimación, por lo que no surge con claridad el valor de los activos a considerar, resultando insuficiente para tener por configurada la excepción, la cual además debe interpretarse restrictivamente.", "causa_criterio": "otro", "hecho_determinante": "Falta de acreditación documental (balance o certificación contable) y del método de cálculo utilizado para estimar el valor de los activos locales de FERRO ARGENTINA correspondientes al año 2020, invocados para sustentar la excepción de minimis.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9", "precedentes": "", "parrafos": "27 | 28 | 29", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "340", "archivo": "OPI-340.pdf", "expediente": "EX-2021-118850245- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la novación mediante la cual ITA asume la posición contractual de ALITALIA en el Joint Business Agreement suscripto con Aerolíneas Argentinas se encuentra exenta de la obligación de notificación del art. 9° de la Ley 27.442, por tratarse de una transferencia gratuita a favor del Estado italiano (art. 9° reglamentación) o por no superar los montos del art. 11 inc. e).", "argumento_consultante": "La operación es gratuita (no hay precio ni cesión de activos) y beneficia al Estado italiano, controlante de ITA, por lo que aplicaría la exención reglamentaria; subsidiariamente, el valor de la operación no supera los umbrales del art. 11 inc. e) de la Ley 27.442.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442 por no encuadrar en lo dispuesto en el artículo 7° de la norma indicada.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La CNDC entendió que no hubo cambio de control, ya que el Estado italiano era quien conducía los negocios de ALITALIA mediante la administración extraordinaria al momento de suscribirse el JBA, y es el mismo Estado italiano quien controla a ITA, que asumió esa posición contractual, por lo que no existe concentración económica en los términos del art. 7°.", "causa_criterio": "control_ya_preexistente", "hecho_determinante": "ALITALIA estaba bajo administración extraordinaria designada por el Estado italiano, y ITA -quien asumió su posición en el JBA- es una empresa creada y controlada en un 100% por ese mismo Estado, sin que existiera cambio del controlante final.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "", "parrafos": "21 | 22 | 23 | 24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "341", "archivo": "OPI-341.pdf", "expediente": "EX-2021-125732219- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Las partes consultaron si (a) el volumen de negocios de las empresas involucradas no supera el umbral del artículo 9° de la Ley N.° 27.442 y (b) subsidiariamente, si corresponde tener por configurada la excepción a la obligación de notificación prevista en el artículo 11, inciso d) de la Ley N.º 27.442.", "argumento_consultante": "El volumen de negocios de las empresas involucradas no supera el umbral del artículo 9°, y subsidiariamente aplicaría la excepción del artículo 11 inciso d).", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "IM GLOBAL MINING LIMITED ya se había presentado a notificar la operación en los términos del artículo 9°, por lo que, atendiendo a las relaciones económicas reales y por razones de economía procesal, la CNDC consideró la operación sujeta a notificación en lugar de expedirse sobre los planteos de exención.", "causa_criterio": "otro", "hecho_determinante": "El 31 de octubre de 2022 se recibió ante la CNDC la presentación de IM GLOBAL MINING LIMITED notificando la operación en los términos del artículo 9°, mientras se tramitaba esta consulta.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "16 | 17", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "343", "archivo": "OPI-343.pdf", "expediente": "EX-2020-73660395- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "MIRGOR consultó si la adquisición del control exclusivo sobre HOLDCAR, FAMAR FUEGUINA y ELECTROTÉCNICA FAMAR, perfeccionada el 15 de agosto de 2019, resultaba alcanzada por la excepción de minimis del artículo 11, inc. (e), de la Ley N.º 27.442.", "argumento_consultante": "El valor de los activos a computar debe ser el que surge del balance individual de HOLDCAR (no consolidado), excluyendo los activos de FAMAR FUEGUINA por estar valuados como inversiones bajo el método del valor patrimonial proporcional, y subsidiariamente excluyendo activos 'improductivos'; además el precio pagado sería el mejor indicador del valor de los activos por racionalidad económica.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta, consistente en la adquisición del control exclusivo sobre HOLDCAR S.A., FAMAR FUEGUINA S.A. y ELECTROTÉCNICA FAMAR S.A.C.I.I.E. por parte de MIRGOR S.A.C.I.F.I.A., se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley N.º 27.442.", "medidas_accesorias": "multa", "CAUSA_ratio_decidendi": "Debe recurrirse a los estados contables consolidados de HOLDCAR y sus controladas para determinar el valor de los activos transferidos, pues ello refleja la realidad económica de la operación; el rubro «Inversiones» del balance individual solo refleja una valuación contable de los instrumentos de capital, no el activo efectivamente transferido. Con el activo consolidado ($939.620.956) se supera el umbral de minimis de $528.000.000.", "causa_criterio": "monto_de_activos_bajo_umbral", "hecho_determinante": "El estado de situación patrimonial consolidado de HOLDCAR, FAMAR FUEGUINA y ELECTROTÉCNICA FAMAR arrojaba activos totales de $939.620.956, muy por encima del umbral de $528.000.000 requerido para la excepción de minimis, aun cuando el balance individual de HOLDCAR mostraba activos por debajo de ese umbral.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9 | Ley 27.442 art. 85", "precedentes": "OPI 10/99 | OPI 227/06 | OPI 229/07 | OPI 632/07 | OPI 698/08 | OPI 84/01 | OPI 98/01 | OPI 87/04 | OPI 667/08 | OPI 83/00 | OPI 101/01", "parrafos": "39 | 40 | 41 | 42 | 43 | 55", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 85"]}, {"OPI": "345", "archivo": "OPI-345.pdf", "expediente": "EX-2022-98394507- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la adquisición del control de NIKE ARGENTINA por parte de REGENCY SOUTH (Grupo REGENCY) a NIKE RETAIL y NIKE EUROPE HOLDING se encuentra exenta de la obligación de notificación prevista en el artículo 9° de la Ley 27.442, por encuadrar en la excepción del artículo 11 inc. c).", "argumento_consultante": "El Grupo REGENCY no tenía actividad, activos ni acciones en Argentina previo a la operación; las sociedades adquirentes fueron constituidas exclusivamente para realizar la transacción, por lo que correspondería la excepción de primera entrada al país prevista en el artículo 11 inc. c).", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja a la SEÑOR SECRETARIO DE COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Aplicando el principio de realidad económica, se verificó que ni REGENCY SOUTH, ni REGENCY RETAIL, ni REGENCY SOCO (constituidas exclusivamente para la operación) ni sus controlantes tenían actividad, activos o presencia previa en ningún mercado argentino, por lo que no podía existir concentración alguna y subsistía el espíritu de la excepción del art. 11 inc. c).", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "Las sociedades adquirentes REGENCY SOUTH y REGENCY RETAIL, así como su controlante REGENCY SOCO, fueron constituidas exclusivamente para realizar la operación y carecían de actividad, activos o acciones previas en Argentina.", "fundamento_normativo": "Ley 27.442 art. 11 inc. c | Ley 27.442 art. 4 | Ley 27.442 art. 9", "precedentes": "", "parrafos": "24 | 29 | 30", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. c", "Ley 27.442 art. 4", "Ley 27.442 art. 9"]}, {"OPI": "346", "archivo": "OPI-346.pdf", "expediente": "EX-2022-117021007- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Se consulta si la adquisición por parte de GLENCORE de la totalidad de la participación de NEWMONT en MARA (pasando GLENCORE de 25% a 43,75%) se encuentra sujeta a la obligación de notificar, dado que las partes sostienen que MARA sigue siendo controlada exclusivamente por YAMANA.", "argumento_consultante": "YAMANA sigue siendo controlante exclusiva de MARA como Administradora, y los derechos de veto de GLENCORE (mayoría calificada y unanimidad) constituyen mínimos derechos de protección de minorías estándares en la industria minera, sin otorgarle influencia sobre decisiones estratégicas de política comercial.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta, que consiste en la adquisición de la totalidad de la participación accionaria de NEWMONT CORPORATION en MINERA AGUA RICA ALUMBRERA LIMITED por parte de GLENCORE INTERNATIONAL AG, se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "El Acuerdo de Accionistas otorga a GLENCORE, pese a ser accionista minoritario, derechos de veto sobre un número y calidad de asuntos (presupuestos, planes de vida de la mina, política de comercialización, designación del órgano reemplazante del Administrador) que exceden la mera protección de su inversión financiera y le confieren influencia sustancial sobre la estrategia competitiva de MARA, especialmente porque tras la operación YAMANA ya no puede alcanzar la mayoría calificada del 75% sin el voto de GLENCORE.", "causa_criterio": "otro", "hecho_determinante": "Tras la adquisición, el joint venture quedó reducido a dos accionistas (YAMANA 56,25% y GLENCORE 43,75%), y YAMANA necesita indefectiblemente el voto de GLENCORE para alcanzar la mayoría calificada del 75% y la unanimidad requeridas para 43 asuntos estratégicos, incluyendo la designación del órgano que reemplazaría al Administrador si YAMANA dejara de ser mayoritaria.", "fundamento_normativo": "Ley 27.442 art. 7 inc. c | Ley 27.442 art. 9", "precedentes": "OPI 124 | Dictamen CNDC 570/2006", "parrafos": "33 | 40 | 41 | 42 | 47", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. c", "Ley 27.442 art. 9"]}, {"OPI": "347", "archivo": "OPI-347.pdf", "expediente": "EX-2022-121838588- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la adquisición del control exclusivo sobre KTBO S.A. por parte de GLOBANT ESPAÑA S.A. se encuentra exenta de notificación obligatoria por aplicación de la excepción de minimis del artículo 11 inciso e) de la Ley N.º 27.442.", "argumento_consultante": "Las consultantes sostienen que se cumplen los tres requisitos del artículo 11 inciso e): el monto de la operación y el valor de los activos locales están por debajo del umbral de 20 millones de unidades móviles, y el mercado relevante de la operación difiere de aquellos involucrados en transacciones previas del grupo, por lo que no se supera el umbral acumulado de operaciones en el mismo mercado.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SECRETARIO DE COMERCIO disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "No se acreditó el tercer requisito del inciso e) del art. 11, ya que no pudo determinarse con precisión que las operaciones previas del grupo comprador y la presente se dieran en mercados distintos; dada la conexidad entre los mercados de IT en que operan comprador y objeto, corresponde considerar que ambas operaciones fueron efectuadas en el mismo mercado, por lo que no se cumple la excepción de minimis.", "causa_criterio": "otro", "hecho_determinante": "Las operaciones previas de concentración del grupo GLOBANT (CONC 1858, 1827, 1776, 1765) fueron realizadas de manera amplia dentro del mismo mercado de IT en que también se desempeña, con conexidad, la compañía objeto KTBO, sin que la CNDC contara con elementos suficientes en el marco de una opinión consultiva para determinar la existencia de mercados o segmentos diferenciados.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9", "precedentes": "CONC 1858 | CONC 1827 | CONC 1776 | CONC 1765", "parrafos": "24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "348", "archivo": "OPI-348.pdf", "expediente": "EX-2023-00947091- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "La consultante plantea que: i) la transacción no consiste en un acto de concentración económica en los términos del artículo 7 de la Ley N.º 27.442, toda vez que la sociedad adquirida no calificaría como empresa; ii) en caso de que la CNDC entendiera que sí lo son, la adquisición encuadraría en la exención prevista en el inciso d), del artículo 11 de dicho cuerpo normativo.", "argumento_consultante": "AUTOTROL no desarrolla ninguna actividad, careciendo de contratos con terceros y/o accionistas, por lo que no calificaría como 'empresa' y, subsidiariamente, sería una empresa liquidada que no registró actividad en el país en el último año, encuadrando en la exención del art. 11 inc. d).", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta, la cual consiste en la adquisición del control exclusivo sobre AUTOTROL RENOVABLES S.A. por parte de PAMPA ENERGÍA S.A. se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "AUTOTROL realizó actos preparatorios propios de un proyecto en etapa preliminar (autorización como agente generador, estudio eléctrico, declaración ENRE, estudios de impacto ambiental, certificación de uso de suelo), lo que impide asimilarla a una empresa sin actividad económica. Además, aun de considerarse liquidada, su actividad principal coincide con la de PAMPA (generación de electricidad), lo que excluye la aplicación de la exención del art. 11 inc. d).", "causa_criterio": "otro", "hecho_determinante": "AUTOTROL, titular del proyecto Parque Eólico Wayra I, había realizado actos preparatorios sustanciales (autorización CAMMESA, estudio eléctrico, declaración ENRE, estudios ambientales y certificación de uso de suelo) que reflejan una etapa preliminar de un proyecto en desarrollo y no una ausencia de actividad económica; además su actividad principal coincide con la de la adquirente.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. d", "precedentes": "OPI 124 | OPI 278 | OPI 276 | OPI 279 | OPI 285", "parrafos": "19 | 20 | 23 | 24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. d"]}, {"OPI": "349", "archivo": "OPI-349.pdf", "expediente": "EX-2022-138369065- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La consultante considera que la operación no es una concentración económica en los términos del artículo 7 de la LDC y no corresponde su notificación dado que se trata de la adquisición de cuatro parcelas que no registran actividad alguna.", "argumento_consultante": "La mera adquisición de un inmueble que no registra actividad alguna no puede caracterizarse como adquisición de una «empresa» ni de un «activo» en los términos de la LDC, más aún cuando la compradora no se dedica al rubro inmobiliario.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta CNDC aconseja disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El inmueble adquirido no constituye una unidad de negocios con volumen, clientela y valor propios: al momento de la toma de posesión no desarrollaba actividad económica alguna, y la compradora, que no se dedica al rubro inmobiliario, planea destinarlo a su propia actividad industrial y no a la explotación inmobiliaria.", "causa_criterio": "otro", "hecho_determinante": "El inmueble adquirido (parcelas con una nave industrial en construcción) no registraba actividad económica ni explotación al momento de la operación, y la compradora no se dedica a la actividad inmobiliaria ni tiene intención de darle ese destino, sino usarlo como insumo de su propia actividad productiva.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "OPI 290 | OPI 83 | OPI 131 | OPI 272 | OPI 271", "parrafos": "19 | 20 | 21 | 22 | 24 | 25", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "350", "archivo": "OPI-350.pdf", "expediente": "EX-2023-01811829- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "La operación consiste en la adquisición por parte de AMERICAN AIRLINES, INC. de 66.346.154 acciones B emitidas por JETSMART HOLDINGS LIMITED, equivalentes al 35,384% de sus acciones, en manos de INDIGO ANDEAN PARTNERS LP. La consultante sostiene que la operación no debe considerarse una concentración económica ya que no implica la adquisición de control o influencia sustancial en los términos del artículo 7º de la Ley 27.442, por lo que estaría exenta de la obligación de notificación establecida en el artículo 9° de dicha norma.", "argumento_consultante": "La adquisición de una participación minoritaria del 35,384% no otorga a AMERICAN control, influencia sustancial ni control negativo sobre JETSMART, ya que INDIGO conserva el 64,615% restante y mantiene el control individual y positivo de la compañía, incluyendo mayoría en el directorio, quorum, decisiones por mayoría simple y voto dirimente.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones realizadas en los párrafos que anteceden, esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SECRETARIO DE COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La participación adquirida por AMERICAN es minoritaria y no le otorga control ni influencia sustancial sobre la estrategia competitiva de JETSMART, dado que INDIGO mantiene la mayoría en el directorio, el quorum no depende de la presencia de directores de AMERICAN, las decisiones se toman por mayoría simple con voto dirimente a favor de INDIGO, y los asuntos reservados que requieren aprobación de AMERICAN constituyen protecciones habituales de accionistas minoritarios que no interfieren con el curso ordinario de los negocios. Asimismo, los acuerdos de Código Compartido e Interlínea no otorgan a AMERICAN mayor poder que el derivado de su participación accionaria, al ser no exclusivos y rescindibles por cualquiera de las partes.", "causa_criterio": "participacion_minoritaria_pasiva | ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "AMERICAN adquirió el 35,384% de las acciones de JETSMART, sin obtener mayoría en el directorio (máximo 2 directores de hasta 10), sin que su presencia sea imprescindible para el quorum, sin poder bloquear decisiones tomadas por mayoría simple, y con INDIGO conservando el 64,615% restante, la presidencia del directorio con voto dirimente y el control efectivo de la sociedad.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "OPI 108 | OPI 35/00", "parrafos": "41 | 42 | 43 | 44 | 45 | 46", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "351", "archivo": "OPI-351.pdf", "expediente": "EX-2023-24797083- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "La consultante considera que la operación no es una concentración económica en los términos del artículo 7 de la LDC y no corresponde su notificación, dado que se trata de la mera adquisición de unidades funcionales y complementarias de un edificio por parte de una compañía ajena al rubro inmobiliario.", "argumento_consultante": "No se verifica toma de control de una 'empresa': la operación no implica fusión, transferencia de fondo de comercio, adquisición de acciones ni de activos que otorguen influencia sustancial sobre la estrategia competitiva de empresa alguna; las unidades adquiridas no constituyen una 'empresa'.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La mayoría de las unidades adquiridas (cocheras, oficinas y complementarias, sin contrato de locación vigente) no configuran el concepto de 'activo' del art. 7 inc. d), pues no constituyen una unidad de negocios con volumen, clientela y valor propios, siendo destinadas a uso propio del adquirente. Los dos inmuebles con contratos de locación cedidos sí son activos, pero su valor conjunto no supera el umbral del art. 11 inc. e), por lo que quedan exentos de notificación.", "causa_criterio": "otro | monto_de_activos_bajo_umbral", "hecho_determinante": "Las 18 unidades destinadas a cocheras y 4 complementarias tienen superficies mínimas (entre 2 y 18 m2) y bajísima incidencia porcentual, sin generar volumen de negocios propio; los dos inmuebles cedidos con contratos de locación vigentes tienen un valor conjunto de $463.563.823,69, inferior al equivalente de 20.000.000 de unidades móviles, sin operaciones previas relevantes en los 36 meses anteriores en el mismo mercado.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9", "precedentes": "OPI 83 | OPI 131", "parrafos": "17 | 18 | 19 | 20 | 22 | 25 | 26 | 27 | 28 | 29", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "352", "archivo": "OPI-352.pdf", "expediente": "EX-2023-34304742- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "La consultante solicitó confirmar que la adquisición por parte de PUMA de una unidad funcional (sala de exposición) y una cochera del inmueble “Conjunto Vohe” se encuentra exenta de la obligación de notificar prevista en el artículo 9 de la LDC.", "argumento_consultante": "La operación no constituye adquisición de una “empresa” ni de activos que otorguen influencia sustancial, ya que se trata de la mera compra de una unidad funcional y una cochera, sin implicar fusión, transferencia de fondo de comercio ni adquisición de acciones.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja al Señor Secretario de Comercio disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La unidad funcional y la cochera adquiridas no constituyen una unidad de negocios con volumen de negocios, clientela y valor propios, ya que PUMA no se dedica a la actividad inmobiliaria y las utilizará solo para su propia actividad (sala de exposición y cochera), sin continuar una actividad económica preexistente en el inmueble.", "causa_criterio": "otro", "hecho_determinante": "La operación consistió en la adquisición de una unidad funcional destinada a sala de exposición interna de productos y una cochera, sin que estos bienes constituyan una unidad de negocios independiente ni impliquen continuidad de una actividad económica preexistente, y sin que PUMA se dedique al rubro inmobiliario.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "OPI 290 | OPI 83 | OPI 131 | OPI 272 | OPI 271", "parrafos": "19 | 20 | 21 | 22 | 23", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "353", "archivo": "OPI-353.pdf", "expediente": "EX-2020-60005227- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "La consultante plantea que la adquisición del 100% de las acciones de SURAMERICANA por parte de FCA, si bien cumple los parámetros del artículo 9° de la LDC, se encuentra exenta de notificar por encuadrar en la excepción «de minimis» del inciso e) del artículo 11° de la misma ley.", "argumento_consultante": "El monto de la operación y el valor de los activos transferidos son inferiores a los umbrales legales de la excepción de minimis, y la operación previa en la que participó la consultante en los últimos 36 meses correspondía a un mercado relevante distinto (fabricación de tanques plásticos de combustible vs. producción de automóviles).", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta, que consiste en la adquisición del 100% del capital accionario de SURAMERICANA DE PLÁSTICOS SOPLADOS S.A. por parte de FCA AUTOMOBILES ARGENTINA S.A., se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "No pudo tenerse por cumplido el requisito de que las operaciones (la actual y la efectuada en los últimos 36 meses) se refirieran a mercados distintos, dada la conexidad entre los mercados de fabricación y comercialización de automóviles y autopartes en que ambas partes estaban presentes; y por tratarse de una excepción, su interpretación debe ser restrictiva, por lo que ante la falta de certeza no corresponde eximir de la obligación de notificar.", "causa_criterio": "otro", "hecho_determinante": "La operación previa de la consultante (FCA-PEUGEOT, CONC. 1753), realizada en los últimos 36 meses y que superó el umbral legal, involucraba mercados de fabricación y comercialización de automóviles y autopartes que presentan conexidad con los mercados de la operación en consulta, sin que existiera certeza sobre si se trataba de mercados distintos.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. e", "precedentes": "EX-2020-60005227- -APN-DR#CNDC (CONC. 1753)", "parrafos": "40 | 41 | 42 | 44 | 45", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. e"]}, {"OPI": "354", "archivo": "OPI-354.pdf", "expediente": "EX-2022-140156955- APN-DR#CNDC,", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la adquisición del control exclusivo sobre ETERNUM ENERGY S.A. por parte de TOTAL AUSTRAL S.A. (Sucursal Argentina), subsidiaria de TOTALENERGIES S.E., se encuentra sujeta a notificación conforme la Ley 27.442.", "argumento_consultante": "", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442, comunicar a TOTALENERGIES S.E. que resulta de aplicación el punto a.1 de la Resolución 26/2006 de la ex Secretaría de Coordinación Técnica.", "medidas_accesorias": "remision | comunicacion_resolucion_26_2006", "CAUSA_ratio_decidendi": "", "causa_criterio": "otro", "hecho_determinante": "El documento no incluye la sección de ANÁLISIS, por lo que no se dispone del razonamiento sustantivo que llevó a la CNDC a calificar la operación como sujeta a notificación.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "44", "confianza": "baja", "alertas_automaticas": "sin ratio_decidendi ; criterio = otro ; confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "355", "archivo": "OPI-355.pdf", "expediente": "EX-2023-82957803- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Si la suscripción por PBB y DOW de 200.000.000 de obligaciones negociables convertibles (ONC) en acciones de CGC, emitidas mediante colocación privada, constituye una toma de control en los términos del Art. 7 de la Ley 27.442 y, en su caso, si se encuentra exenta de notificar conforme el Art. 11 inc. b).", "argumento_consultante": "La operación es una mera emisión de deuda; la conversión en acciones es solo opcional y futura, y aun si se convirtiera la totalidad de las ONC, la participación resultante sería minoritaria y no otorgaría control ni influencia sustancial sobre CGC.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley N.º 27.442 por no encuadrar en lo dispuesto en el artículo 7 de la norma indicada.", "medidas_accesorias": "obligacion_de_notificar_futura_conversion_si_implica_toma_de_control", "CAUSA_ratio_decidendi": "Al momento de la consulta, la suscripción de las ONC no implica por sí misma la adquisición de control ni influencia sustancial sobre CGC, dado que la conversión en acciones clase C es meramente opcional y futura, y aun de concretarse, los derechos otorgados (designación de un director o síndico) no aseguran injerencia sobre las decisiones del directorio dada la composición y régimen de mayorías de la sociedad.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "La conversión de las ONC en acciones clase C depende exclusivamente de la opción futura de los compradores, y aun ejercida, su participación sería minoritaria, sin capacidad de imponer decisiones dado el quórum y mayorías requeridas en el directorio y la comisión fiscalizadora de CGC.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "", "parrafos": "24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "356", "archivo": "OPI-356.pdf", "expediente": "", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la suscripción de un acuerdo por el cual Whirlpool Argentina S.R.L. adquirirá de Newsan S.A. ciertos equipos de aire acondicionado que esta última fabricará en su planta industrial según especificaciones técnicas provistas por Whirlpool, se encuentra sujeta a notificación obligatoria.", "argumento_consultante": "Las partes sostienen que el acuerdo no implica toma de control ni transferencia de activos, ya que se trata de un contrato de façón sin exclusividad, sin opción de compra de la planta, con plazo limitado y sin intercambio de información sensible, manteniendo ambas empresas plena autonomía e independencia.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja al Señor Secretario de Comercio disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley N.° 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El acuerdo es un contrato de façón sin exclusividad ni opción de compra de la planta industrial, de plazo limitado y rescindible por cualquiera de las partes, sin que se transfieran activos ni se otorgue a Whirlpool injerencia en la toma de decisiones de Newsan, por lo que ambas empresas continúan operando de forma separada e independiente.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El acuerdo consiste en un contrato de suministro/façón por 48 meses, sin exclusividad, sin opción de compra de la planta de Newsan, rescindible por cualquiera de las partes, sin intercambio de información sensible ni cláusulas restrictivas accesorias.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 7 inc. e | Ley 27.442 art. 9", "precedentes": "OPI 904 | OPI 177", "parrafos": "30 | 31 | 32 | 33 | 34 | 35", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 7 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. e"]}, {"OPI": "356", "archivo": "OPI-365.pdf", "expediente": "EX-2024-49909274- -APN-DR#CNDC", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar | aplicacion_de_excepcion | encuadre_como_concentracion", "pregunta_texto": "Se consulta si el acuerdo por el cual WHL otorga a NEWSAN una licencia de marca para fabricar, distribuir y comercializar equipos de aire acondicionado constituye una concentración económica sujeta a notificación, o si encuadra en la excepción de minimis del art. 11 inc. e) de la Ley 27.442.", "argumento_consultante": "Las partes sostienen que el acuerdo no implica toma de control porque se limita a activos inmateriales (marca, patentes, diseños) sin volumen de negocios propio, no genera control duradero sobre la planta de NEWSAN y es una simple relación contractual de licencia no exclusiva; subsidiariamente, WHL invoca la excepción de minimis del art. 11 inc. e) por no superar el valor de activos los 20.000.000 de UM.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442; tener por no presentada la notificación prevista en dicho artículo; y comunicar que resulta de aplicación el punto a.1 de la Resolución 26/2006 de la ex Secretaría de Coordinación Técnica.", "medidas_accesorias": "tener_por_no_presentada_la_notificacion | suspension_de_plazos_res_26_2006", "CAUSA_ratio_decidendi": "La licencia de marca transfiere de facto a NEWSAN un volumen de negocios y clientela propios, pues esta fija unilateralmente los precios, define su estrategia comercial y goza de exclusividad frente a la cartera de clientes de WHL; sumado a un plazo potencial de 36 meses, ello configura toma de control en los términos del art. 7 inc. d) de la Ley 27.442, sin encuadrar en la excepción de minimis por ser indeterminable el monto de la operación.", "causa_criterio": "otro", "hecho_determinante": "NEWSAN, mediante la licencia de marca, adquiere la facultad de fijar precios unilateralmente, define su propia estrategia comercial respecto de los productos marca Whirlpool y cuenta con exclusividad frente a la cartera de clientes de WHL, por un plazo potencial de 36 meses, siendo además competidor directo de WHL en el mercado de aires acondicionados.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. e", "precedentes": "OPI 177 | OPI 10/1999 | OPI 138", "parrafos": "28 | 29 | 30 | 33 | 34", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 7 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. e"]}, {"OPI": "357", "archivo": "OPI-357.pdf", "expediente": "EX-2023-24797083--APN-DR#CNDC).", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La consultante considera que la operación no es una concentración económica en los términos del artículo 7 de la LDC ya que la mera adquisición de unidades funcionales y complementarias destinadas a cocheras, oficinas y espacio de maquinarias no tiene la virtualidad de constituir por sí misma una empresa.", "argumento_consultante": "La operación consiste en la mera adquisición de unidades funcionales y complementarias de un inmueble, las cuales no constituyen una empresa ni generan un volumen de negocios independiente, por lo que no encuadra en el artículo 7 de la LDC y no debe notificarse.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley N.º 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Las unidades adquiridas fueron simultáneamente objeto de un contrato de locación con el propio vendedor, lo que demuestra que la adquisición no fue para uso propio de PUMA sino como activo generador de renta con clientela y valor propios, encuadrando así en el concepto de activos de empresa sujetos a control previo.", "causa_criterio": "otro", "hecho_determinante": "En la misma fecha de la adquisición, PUMA suscribió un contrato de locación de las unidades con los vendedores CRESUD e IRSA, vigente hasta 2029, lo que evidencia que la adquisición no fue realizada para uso propio sino que constituye un activo generador de negocio independiente.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9 | Ley 27.442 art. 11", "precedentes": "OPI 83 | OPI 131 | OPI 351", "parrafos": "21 | 22 | 23", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9", "Ley 27.442 art. 11"]}, {"OPI": "358", "archivo": "OPI-358.pdf", "expediente": "EX-2023-99398685- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "RENOPACK y BUNGE consultan si la celebración de un contrato de façon, por el cual RENOPACK destinará el 100% de la capacidad de su planta a fraccionar y envasar aceite refinado para BUNGE, se encuentra sujeta a la obligación de notificación previa de la Ley 27.442.", "argumento_consultante": "Las partes entienden que la prestación de servicios de façon no reuniría los requisitos para quedar sujeta a notificación obligatoria, pese a existir un contrato condicional de adquisición del 33,33% de las acciones de RENOPACK por parte de BUNGE, aún pendiente de perfeccionamiento.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja al SEÑOR SECRETARIO DE COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442, con la salvedad de que la opinión se basa en el sustento fáctico descripto por los consultantes.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El contrato de façon solo implica la prestación de un servicio de fraccionamiento y envasado por parte de RENOPACK a BUNGE, sin que ello importe una transferencia de activos, acciones o control sobre RENOPACK, ya que la adquisición accionaria del 33,33% por parte de BUNGE se encuentra sujeta a condiciones aún no cumplidas.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El contrato de façon es un acuerdo de prestación de servicios industriales por 12 meses, renovable, mientras que la adquisición del 33,33% de las acciones de RENOPACK por BUNGE (en el marco del concurso de VICENTIN) está sujeta a condiciones precedentes aún no perfeccionadas, e incluso el propio contrato de façon se resolvería automáticamente si esa operación entrara en vigencia.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "2 | 3 | 6 | 7 | 8", "confianza": "baja", "alertas_automaticas": "confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "359", "archivo": "OPI-359.pdf", "expediente": "EX-2017-29133916- -APN-DDYME#MP,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la adquisición por ENOD S.A. del 50% de QUALITY INVEST S.A. en poder de IRSA, y la posterior venta de ese mismo paquete accionario por ENOD a CONSTRUIR S.A. (quedando QUALITY controlada conjuntamente por EFESUL y CONSTRUIR), se encuentran sujetas a la obligación de notificación del art. 9 de la Ley 27.442.", "argumento_con
