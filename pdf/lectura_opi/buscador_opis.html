<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de OPIs — CNDC</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1a1d21; --muted:#666e79; --line:#e2e5ea;
  --accent:#1f5fa8; --accent-soft:#e8f0fa;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;position:sticky;top:0;z-index:10}
.wrap{max-width:1100px;margin:0 auto}
h1{margin:0 0 12px;font-size:20px;font-weight:650}
h1 span{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
#q{width:100%;padding:11px 14px;font-size:16px;border:1px solid var(--line);border-radius:8px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13px;color:var(--ink);max-width:260px}
#count{margin-top:8px;font-size:13px;color:var(--muted)}
main{max-width:1100px;margin:18px auto;padding:0 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.head{padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.head:hover{background:#fafbfc}
.num{font-weight:700;color:var(--accent);font-size:15px;min-width:74px}
.num small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.summary{flex:1;min-width:0}
.preg{font-size:14px;margin:0 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef1f5;color:#4a525c;white-space:nowrap}
.tag.s{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chev{color:var(--muted);font-size:12px;padding-top:3px}
.body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.f{margin-top:14px}
.f h3{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
.f p{margin:0;font-size:14px;white-space:pre-wrap}
.f ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
mark{background:#ffe9a8;padding:0 1px;border-radius:2px}
.empty{text-align:center;color:var(--muted);padding:50px 0}
@media(max-width:640px){.num{min-width:0}.head{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Buscador de OPIs <span id="tot"></span></h1>
  <input id="q" type="search" placeholder="Buscar en pregunta, respuesta, criterio, normas, expediente…" autocomplete="off">
  <div class="filters">
    <select id="f-sent"><option value="">Todos los sentidos de respuesta</option></select>
    <select id="f-tipo"><option value="">Todos los tipos de pregunta</option></select>
    <select id="f-crit"><option value="">Todos los criterios</option></select>
    <select id="f-ley"><option value="">Todas las leyes</option></select>
  </div>
  <div id="count"></div>
</div></header>
<main id="list"></main>

const DATA = [{"OPI": "175", "archivo": "OPI-175.pdf", "expediente": "EX-2019-51162328- -APN-DGD#MPYT", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Si la transferencia de los productos de venta libre para el cuidado de la salud (entre ellos Caladryl y Agarol) entre PFIZER y J&J ARGENTINA, en el marco del Acuerdo Global celebrado entre PFIZER INC. y J&J CORPORATION, debía notificarse como concentración económica.", "argumento_consultante": "J&J ARGENTINA sostuvo que la operación no era notificable por tratarse de una operación de conglomerado que no podía disminuir, restringir o distorsionar la competencia, y que las transferencias de Caladryl y Agarol se encontraban comprendidas en la excepción de insignificancia del art. 10 inc. e) de la Ley 25.156.", "respuesta_sentido": "abstracta_o_desistida", "respuesta_texto": "En base a las consideraciones expuestas en los párrafos que anteceden, esta Comisión Nacional de Defensa de la Competencia aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN ordenar el archivo del presente Expediente Nº S01:0362504/2009 caratulado: “JOHNSON & JOHNSON DE ARGENTINA S.A.C. E I. S/ CONSULTA INTERPRETACION LEY 25.156 (OPI N° 175)”, por devenir en abstracto expedirse respecto del planteo efectuado en virtud de los argumentos expuestos.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "La transferencia local de los productos consultada (Caladryl y Agarol) formaba parte de una única operación de concentración económica celebrada en el extranjero entre PFIZER INC. y J&J CORPORATION, la cual ya había sido investigada, calificada como notificable y sancionada en otros expedientes (DP 86 y Conc. 1064), por lo que lo que correspondía notificar era la compraventa global y no las transferencias locales objeto de esta consulta.", "causa_criterio": "otro", "hecho_determinante": "La operación consultada (transferencia local de productos Caladryl y Agarol) era parte integrante de una única operación de concentración económica global celebrada entre PFIZER INC. y JOHNSON & JOHNSON CORPORATION, ya analizada, calificada como notificable y objeto de sanción en los expedientes DP 86 y Conc. 1064, tornando abstracto un nuevo pronunciamiento sobre la consulta original.", "fundamento_normativo": "Ley 25.156 art. 8 | Ley 25.156 art. 10 inc. e", "precedentes": "DP 86 - PFIZER INC. Y JOHNSON & JOHNSON CORPORATION S/DILIGENCIA PRELIMINAR | Conc. 1064 - PFIZER INC. S/NOTIFICACIÓN ART. 8 DE LA LEY 25.156 | Resolución CNDC N° 51/13 | Resolución SC N° 164/2015 | Resolución SC N° 628/2017", "parrafos": "21 | 22 | 34 | 35", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 8", "Ley 25.156 art. 10 inc. e"]}, {"OPI": "229", "archivo": "OPI-229.pdf", "expediente": "EXP-S01:0087642/2013", "ley": "25.156 | 26.993 | 27.442", "pregunta_tipo": "notificacion_tardia | otro", "pregunta_texto": "ADMINISTRATIVE PROCESSING CENTER S.A. y PORT SECURITY SERVICE S.A. interpusieron recurso de reconsideración y, en subsidio, recurso de apelación contra la Resolución N° 936/2017 que les impuso una multa solidaria por notificación tardía de la adquisición del 100% de IVETRA S.A., solicitando además la eximición del previo pago (solve et repete) por perjuicio irreparable.", "argumento_consultante": "Sostuvieron violación de irretroactividad de la ley penal y ley penal más benigna respecto del Art. 68 Ley 26.993, prescripción de la acción, falta de graduación diferenciada de la multa entre compradores y vendedores, y perjuicio irreparable que justificaría eximirlos del previo pago.", "respuesta_sentido": "otro", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO: a- Denegar el recurso de reconsideración solicitado por ADMINISTRATIVE PROCESSING CENTER S.A. y PORT SECURITY SERVICE S.A.; b- Tener por interpuesto el recurso directo interpuesto por las firmas en los términos de los Artículos 52 y 53 de la Ley Nº 25.156; c- Exceptuar a las firmas de depositar el monto de la multa impuesta por haber acreditado que el cumplimiento del mismo ocasionaría un perjuicio irreparable de acuerdo a lo previsto en el Artículo 53 in fine de la Ley N° 25.156.", "medidas_accesorias": "exencion_de_previo_pago | denegacion_de_reconsideracion", "CAUSA_ratio_decidendi": "Se denegó la reconsideración porque los argumentos de las partes (irretroactividad, prescripción, falta de graduación diferenciada, informalismo) no lograron conmover los fundamentos de las resoluciones dictadas; sin embargo, se eximió el previo pago porque las firmas acreditaron mediante balances y documentación que su situación económica (rescisión contractual, pérdida de operatividad) tornaba el depósito de la multa un perjuicio irreparable, conforme lo exige el Art. 53 in fine de la Ley 25.156.", "causa_criterio": "otro", "hecho_determinante": "Las firmas acreditaron con balances contables y documentación (rescisión del contrato con AGP, veda de acceso al predio, reclamos indemnizatorios de trabajadores, caída del volumen de negocios) que el depósito previo de la multa les ocasionaría un perjuicio irreparable.", "fundamento_normativo": "Ley 25.156 art. 53 inc. in fine | Ley 25.156 art. 8 | Ley 25.156 art. 49", "precedentes": "", "parrafos": "35 | 46", "confianza": "media", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 53 inc. in fine", "Ley 25.156 art. 8", "Ley 25.156 art. 49"]}, {"OPI": "232", "archivo": "OPI-232.pdf", "expediente": "EX-2017-22751096- -APN-DDYME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Dilucidar si la compra del 100% de las acciones de ILE por parte de CFA, en su carácter de fiduciario del «Fideicomiso Productora Agroindustrial Nacional», se encuentra exenta de la obligación de notificación del Artículo 8° de la Ley 25.156, por encuadrar en el supuesto de «empresa liquidada» previsto en el inciso d) del Artículo 10 de dicha ley.", "argumento_consultante": "ILE fue declarada en quiebra en el año 2000 y, pese a la continuidad de explotación sostenida artificialmente por programas de asistencia provincial, debe considerarse empresa liquidada a los efectos de la excepción de notificación; además, respecto de los hechos nuevos, la falta de mayoría estable entre fiduciantes impedía considerar que hubo toma de control.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Las siguientes operaciones no se encuentran sujetas a la obligación de notificación del Artículo 8° de la Ley 25.156: (i) la constitución del Fideicomiso mediante la cual CFA adquirió las acciones de ILE y MEGUIDA; (ii) la incorporación de FFDEPJ y PNOA como fiduciantes (5/12/2014); y (iii) la compra por la Provincia de Jujuy de los DBF de PNOA (31/1/2018).", "medidas_accesorias": "obligacion_de_notificar_hecho_nuevo_12_08_2016", "CAUSA_ratio_decidendi": "La actividad económica de ILE en el año previo a la operación original se sostenía de manera artificial mediante subsidios provinciales con el único fin de preservar el empleo, y no reflejaba eficiencia productiva genuina ni ventas propias, por lo que corresponde encuadrarla como «empresa liquidada» en los términos económicos —no técnico-jurídicos— del inciso d) del Artículo 10 de la Ley 25.156.", "causa_criterio": "otro", "hecho_determinante": "ILE fue declarada en quiebra en 2000 y, si bien continuó operando, no registró ventas ni ganancias propias en el año previo a la operación, sosteniéndose exclusivamente por subsidios del programa de asistencia provincial para preservar puestos de trabajo, lo que llevó a calificarla como empresa liquidada según el concepto económico adoptado por la CNDC.", "fundamento_normativo": "Ley 25.156 art. 10 inc. d | Ley 25.156 art. 6 | Ley 25.156 art. 8", "precedentes": "", "parrafos": "48 | 49 | 53 | 54 | 55 | 56", "confianza": "alta", "alertas_automaticas": "criterio = otro ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. d", "Ley 25.156 art. 6", "Ley 25.156 art. 8"]}, {"OPI": "282", "archivo": "OPI-282.pdf", "expediente": "EX-2018-37587360- -APN-DGD#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Concluyen que la operación objeto de consulta no queda sujeta a la notificación obligatoria prevista en el artículo 8 de la Ley N° 25.156, en virtud de que el valor de los activos ubicados en Argentina es menor al límite vigente y que consideran que el reducido valor de los activos, no se les asignó valor alguno dentro del precio de la transacción.", "argumento_consultante": "El valor de los activos situados en Argentina de la empresa objeto (CHEMETALL ARGENTINA S.R.L.) es insignificante y no se le asignó valor específico dentro del precio global de la transacción, por lo que la operación no alcanza el umbral de notificación.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas en los párrafos precedentes, esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Durante la tramitación entró en vigencia la nueva Ley 27.442 con umbrales actualizados de notificación, y bajo dicha normativa el monto de la operación y el valor de los activos transferidos en Argentina se encuentran notablemente por debajo de los nuevos umbrales previstos, por lo que la operación no supera el umbral cuantitativo requerido para la notificación obligatoria.", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "El valor de los activos situados en Argentina ascendió a $57.966.152 y el monto estimado de la operación en Argentina fue de $253.545.600, montos notablemente por debajo de los nuevos umbrales establecidos por la Ley 27.442, vigente al momento en que debía evaluarse la notificación.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "21 | 22 | 23 | 24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "292", "archivo": "OPI-292.pdf", "expediente": "EX-2017-14121690- -APN-DDYME#MP", "ley": "25.156", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Los consultantes plantearon que la operación por la cual NISSAN adquirió del señor Manuel Fernando Antelo el control exclusivo de NISSAN ARGENTINA se encontraba exenta de la obligación de notificación del Artículo 8° de la Ley 25.156, por resultar aplicable la excepción de 'first landing' prevista en el artículo 10 inciso c) de dicha ley.", "argumento_consultante": "NISSAN no tenía activos, acciones, representantes ni operaciones propias en Argentina antes de la transacción; su único vínculo con el país era un contrato de distribución con la empresa del señor Antelo, y el eventual control de facto de RENAULT sobre NISSAN no debía considerarse relevante porque la decisión de adquirir al distribuidor fue tomada exclusivamente por NISSAN sin intervención de RENAULT.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "la operación traída a consulta por la cual NISSAN MOTOR CO. LTD y NISSAN INTERNATIONAL HOLDING B.V adquieren del señor MANUEL FENANDO ANTELO el control exclusivo de NISSAN ARGENTINA S.A., se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "multa", "CAUSA_ratio_decidendi": "La excepción de 'first landing' no resulta aplicable porque RENAULT S.A., accionista principal de NISSAN (43,4%) con control de facto sobre ella reconocido por la Comisión Europea desde 1999, ya poseía activos y desarrollaba actividad comercial en Argentina a través de RENAULT ARGENTINA y sus controladas (Centro Automotores, Centro del Norte, Plan Rombo, Metalúrgica Tandil), operando incluso en el mismo mercado de venta de vehículos. Por lo tanto, el grupo económico de NISSAN no cumplía el requisito de carecer previamente de activos o acciones en el país que exige el artículo 10 inciso c) de la Ley 25.156.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "RENAULT S.A., controlante de facto de NISSAN desde 1999 según decisión de la Comisión Europea, ya tenía presencia, activos y actividad comercial en Argentina a través de RENAULT ARGENTINA S.A. y sus subsidiarias con anterioridad a la adquisición de NISSAN ARGENTINA por parte de NISSAN.", "fundamento_normativo": "Ley 25.156 art. 10 inc. c | Ley 25.156 art. 8", "precedentes": "CONC 1384", "parrafos": "50 | 51 | 52 | 53 | 54", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. c", "Ley 25.156 art. 8"]}, {"OPI": "294", "archivo": "OPI-288.pdf", "expediente": "EX-2017-14436890- -APN-DDYME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aclaratoria", "pregunta_texto": "Aclare los términos de la Resolución en cuanto a la necesidad de notificar a esa Comisión tanto la emisión y suscripción de Obligaciones Negociables Convertibles como la modificación al Acuerdo; y suspenda los plazos de tramitación del Formulario F1 presentado ante esa Comisión hasta tanto aclare los puntos referidos.", "argumento_consultante": "POINTARGENTUM MASTER FUND, LP sostuvo que la emisión y suscripción de obligaciones negociables convertibles no debía presentarse a control previo por estar encuadrada en la excepción del Artículo 10, inc. b) de la Ley N° 25.156, al no otorgar derechos políticos previos a la conversión de los títulos en acciones.", "respuesta_sentido": "sujeta_con_salvedades", "respuesta_texto": "esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN: (i) tener por interpuesto en legal tiempo y forma el recurso de aclaratoria presentado en fecha 27 de septiembre de 2017 por POINTARGENTUM MASTER FUND, LP con relación a la Resolución Nº 718/2017 emitida por el Sr. SECRETARIO DE COMERCIO en fecha 19 de septiembre de 2017; (ii) aclarar que la Reforma de Acuerdo de Accionistas, al haber entrado en vigencia en fecha 7 de agosto de 2017 e implicar una modificación del esquema de control conjunto dentro de la firma TGLT S.A., queda sujeta al control previo previsto por el Artículo 8º de la Ley Nº 25.156 tal como fuera previsto en el punto 18 del Dictamen CNDC N° 202 que conforme con el Artículo 3° de la Resolución Nº 718/2017 de fecha 19 de septiembre de 2017 forma parte integrante de la mencionada resolución; (iii) aclarar que la sola emisión y suscripción de obligaciones negociables convertibles en acciones, aprobada en fecha 20 de abril de 2017 por la Asamblea Ordinaria y Extraordinaria de TLGT S.A., no queda sujeta al control previo previsto por el Artículo 8º de la Ley Nº 25.156 y no debe ser notificada; y (iv) aclarar que conforme establece el Artículo a.1. del Anexo de la Resolución SCT N° 26/2006, hasta tanto quede firme la Resolución N° 718 del Señor Secretario de Comercio de fecha 19 de septiembre de 2017, quedarán suspendidos los plazos previstos en el Artículo 8 de la Ley N° 25.156 de acuerdo a lo establecido en el Artículo 8° del Decreto N° 89/2001.", "medidas_accesorias": "suspension_de_plazos | remision", "CAUSA_ratio_decidendi": "La Reforma del Acuerdo de Accionistas, al entrar en vigencia, modificó el esquema de control conjunto de TGLT S.A. porque la Cláusula 3.11 (designación y remoción de CEO, CFO y ciertos ejecutivos) implica un cambio de control en los términos del Artículo 6° de la Ley N° 25.156, tal como ya había sido determinado en el Dictamen CNDC N° 202. En cambio, la sola emisión y suscripción de obligaciones negociables convertibles no otorga por sí misma derechos políticos hasta su efectiva conversión en acciones, por lo que no configura una operación de concentración notificable.", "causa_criterio": "control_ya_preexistente | otro", "hecho_determinante": "La Reforma al Acuerdo de Accionistas de TGLT S.A. entró en vigencia el 7 de agosto de 2017 al cumplirse las condiciones precedentes (emisión y colocación de ONC por USD 150.000.000 y suscripción por POINTARGENTUM que la llevaría a poseer el 34,44% del capital), lo que activó la Cláusula 3.11 sobre designación y remoción de ejecutivos, generando un cambio en el esquema de control conjunto ya identificado en el Dictamen CNDC N° 202.", "fundamento_normativo": "Ley 25.156 art. 6 | Ley 25.156 art. 8 | Ley 25.156 art. 10 inc. b | Ley 25.156 art. 37", "precedentes": "Dictamen CNDC N° 202 | Resolución N° 718/2017", "parrafos": "22 | 23", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 6", "Ley 25.156 art. 8", "Ley 25.156 art. 10 inc. b", "Ley 25.156 art. 37"]}, {"OPI": "297", "archivo": "OPI-297.pdf", "expediente": "EX-2017-17119241- -APN-DDYME#MP", "ley": "25.156", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Las consultantes sostuvieron que la concesión otorgada a la UT para el uso y explotación del CECCBA no puede ser considerada una operación de concentración económica en los términos del Artículo 6 de la Ley Nº 25.156, y que en caso de entenderse lo contrario, resultaría aplicable la excepción del inciso d) del Artículo 10 de dicha ley.", "argumento_consultante": "Se trata de un contrato de concesión por un tiempo limitado sobre un inmueble sin actividad desde el año 2014, por lo que no hay transferencia de activos con volumen de negocios independiente, clientela ni valor propio, ni tampoco toma de control de una empresa.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas en los párrafos que anteceden, esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El inmueble objeto de la concesión se encontraba desocupado y sin actividad desde el año 2014, por lo que no puede atribuírsele operación comercial, clientela ni valor propio, incumpliéndose el 'Requisito de Continuidad' exigido por la CNDC para considerar notificable una operación cuyo objeto sea un bien inmueble (que tenga clientela propia y continúe utilizándose en la misma actividad). Adicionalmente, las prerrogativas de poder público del concedente (GCBA) impiden considerar que la UT adquiera el control del bien en los términos del Artículo 6° de la Ley 25.156.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El CECCBA se encontraba desocupado y sin actividad comercial desde el año 2014, y el contrato de concesión es un contrato administrativo en el que el GCBA conserva prerrogativas de poder público (sanciones, rescisión, fijación del destino del bien), por lo que la UT no adquiere control sobre un activo con volumen de negocios, clientela y valor propios.", "fundamento_normativo": "Ley 25.156 art. 6 inc. d | Ley 25.156 art. 8", "precedentes": "OPI 83", "parrafos": "31 | 35 | 36 | 37", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 6 inc. d", "Ley 25.156 art. 8"]}, {"OPI": "298", "archivo": "OPI-298.pdf", "expediente": "EX-2017-22751096- -APN-DDYME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Consulta sobre la obligatoriedad de notificar la operación de concentración económica por la cual COTY INC. adquiere, a través de su subsidiaria COTY GENEVA SARL VERSOIX, una licencia de fragancias de BURBERRY LIMITED.", "argumento_consultante": "Las consultantes sostuvieron que la operación se encontraría fuera del alcance del Artículo 3° de la LDC por no surtir efectos en el país, y que además encuadraría en la excepción de minimis del inciso e) del Artículo 10 de la Ley 25.156.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Se recomienda disponer que la operación traída a consulta consistente en la adquisición, a nivel global, indirecta por parte de COTY INC., a través de su subsidiaria indirecta COTY GENEVA SARL VERSOIX, de una licencia de Burberry, no se encontraría sujeta a la obligación de notificación establecida, a la luz del derogado Artículo 8° de la Ley N° 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Las importaciones de fragancias BURBERRY hacia Argentina, realizadas por distribuidores independientes, no resultaron sustanciales, habituales ni previsibles en términos de valor, volumen y participación en el consumo doméstico, por lo que la operación no podía producir efectos en el mercado nacional y BURBERRY quedaba fuera del ámbito subjetivo de aplicación de la ley.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial | otro", "hecho_determinante": "Las ventas de fragancias BURBERRY en Argentina, a través de dos distribuidores independientes, no superaron los U$S 2.600.000 anuales en el mejor período analizado (2014-2016) y su participación en el consumo doméstico nunca excedió el 5% anual medido en unidades, por lo que las importaciones no podían considerarse una fuente de abastecimiento sustancial, habitual y previsible que generara efectos en el mercado nacional.", "fundamento_normativo": "Ley 25.156 art. 3 | Ley 25.156 art. 8", "precedentes": "OPI 44 | OPI 52 | OPI 64 | OPI 65 | OPI 68 | OPI 99 bis | OPI 211", "parrafos": "21 | 22 | 23", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 3", "Ley 25.156 art. 8"]}, {"OPI": "300", "archivo": "OPI-300.pdf", "expediente": "EX-2017-24238097- -APN-DDYME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la adquisición por parte de HB FULLER del 100% de las acciones de ROYAL se encontraría exenta de la obligación de notificación del Artículo 8° de la LDC, por estar fuera del alcance del Artículo 3º de la Ley 25.156 al no tener efectos en el país, y por encuadrar en la excepción del inciso e) del Artículo 10º de la misma ley.", "argumento_consultante": "ROYAL no tiene subsidiarias ni activos en Argentina, y su único contacto con el país son exportaciones a través de distribuidores y ventas directas limitadas, por lo que la operación no tendría efectos en el mercado nacional.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Se recomienda disponer que la operación consistente en la adquisición por parte de HB FULLER COMPANY del 100% de las acciones emitidas y en circulación de ASP ROYAL ACQUISITION CORP., que se encontraban en manos de ASP ROYAL HOLDINGS LLC., no se encontraría sujeta a la obligación de notificación establecida a la luz del derogado Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Las exportaciones de ROYAL a la Argentina, si bien habituales, no son sustanciales (2,2% de participación de mercado), por lo que su potencialidad de producir efectos en el mercado nacional conforme el Artículo 3° de la Ley 25.156 es nula, resultando dicha ley inaplicable a la operación.", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "ROYAL no tiene subsidiarias ni activos en el país, y sus exportaciones representan solo el 2,2% del mercado local, manteniéndose constantes pero poco sustanciales en los últimos tres años.", "fundamento_normativo": "Ley 25.156 art. 3 | Ley 25.156 art. 8", "precedentes": "OPI 187", "parrafos": "20 | 21 | 22", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 3", "Ley 25.156 art. 8"]}, {"OPI": "301", "archivo": "OPI-301.pdf", "expediente": "EX-2017-29133916- -APN-DDYME#MP", "ley": "25.156", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Consulta sobre si la adquisición por parte de APPLUS del 80% del capital social de FINISTERRE, que implicaba el control indirecto y transitorio de VTV METRO y VTV NORTE en Argentina, se encuentra sujeta a notificación obligatoria, dado que MACOVIT poseía una opción de recompra de dichas compañías ejercible dentro de los seis meses posteriores al cierre.", "argumento_consultante": "Las partes sostienen que la cláusula de opción de recompra a favor de MACOVIT configura un escenario de control meramente transitorio por parte de APPLUS, ya que el plazo de seis meses resulta exiguo para producir un cambio duradero en la estructura de las empresas o en el mercado, conforme a los precedentes de la CNDC (OPI 124, 138, 193 y 147) que exigen que el cambio de control tenga naturaleza permanente para ser objeto de notificación.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO INTERIOR del MINISTERIO DE PRODUCCIÓN Y TRABAJO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El control ejercido por APPLUS sobre VTV METRO y VTV NORTE duró efectivamente solo seis meses y quince días, plazo que, sumado a las limitaciones contractuales impuestas al comprador durante ese período (imposibilidad de realizar inversiones, desinversiones u operaciones extraordinarias, y mantenimiento de la composición de los directorios previa), resulta insuficiente para producir una modificación permanente y duradera en la estructura de las empresas o generar alteraciones en el mercado de VTV, conforme al estándar de permanencia exigido por la doctrina y los precedentes de la Comisión para configurar un cambio de control relevante a efectos de la notificación.", "causa_criterio": "otro", "hecho_determinante": "MACOVIT ejerció efectivamente la opción de recompra el 28 de mayo de 2018, revirtiendo el control de VTV METRO y VTV NORTE luego de que APPLUS lo hubiera detentado solo seis meses y quince días, con limitaciones contractuales que impedían actos de gestión extraordinarios durante ese lapso.", "fundamento_normativo": "Ley 25.156 art. 6 | Ley 25.156 art. 8", "precedentes": "OPI 124 | OPI 138 | OPI 193 | OPI 147", "parrafos": "31 | 32 | 33 | 34", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 6", "Ley 25.156 art. 8"]}, {"OPI": "302", "archivo": "OPI-302.pdf", "expediente": "EX-2017-22751096- -APN-DDYME#MP", "ley": "25.156", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Los consultantes entienden que la transacción sometida a consulta no resulta notificable en los términos del Artículo 8° de la ley 25.156 pues entienden que, atento a que la Operación Anterior ha sido aprobada conforme el Art. 13 a) de la Ley N° 25.156, la operación sometida a consulta, por tratarse de una operación 'inversa', tampoco acarrearía problemas en la competencia en los términos del Artículo 7° de la ley 25.156.", "argumento_consultante": "El comprador ya era accionista de control de GRUPO PILAR antes de la Operación Anterior (aprobada sin objeciones en 2007), por lo que la readquisición del paquete de control sería una operación 'inversa' que no afecta la competencia, ya que la actividad de GRUPO PILAR y el mercado relevante siguen siendo los mismos que los analizados en aquella oportunidad.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas en los párrafos que anteceden, esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN: a) disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La operación configura una toma de control mediante adquisición de paquete accionario en los términos del Art. 6 inc. c) de la Ley 25.156, y las empresas afectadas superan el umbral de volumen de negocios previsto en el Art. 8°; además, el argumento de que la aprobación de la Operación Anterior (2007) exime de notificación a la actual readquisición no resulta aplicable por haber transcurrido un tiempo considerable entre ambas operaciones.", "causa_criterio": "otro", "hecho_determinante": "La compra por parte de Fabio Darío Solanot del 75,1% de las acciones de GRUPO PILAR (readquisición del paquete de control que había vendido en 2006 a ANEP) constituye una nueva toma de control notificable, sin que la aprobación previa de la operación de 2006/2007 exima de notificar la operación actual, dado el tiempo transcurrido entre ambas.", "fundamento_normativo": "Ley 25.156 art. 6 inc. c | Ley 25.156 art. 8", "precedentes": "", "parrafos": "18 | 20 | 21 | 23 | 24", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 6 inc. c", "Ley 25.156 art. 8"]}, {"OPI": "303", "archivo": "OPI-303.pdf", "expediente": "EX-2020-65741151- -APN-DR#CNDC", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar | aplicacion_de_excepcion", "pregunta_texto": "Las partes consultan sobre la obligatoriedad de notificar la Cesión de Derechos Fiduciarios en los términos del artículo 8° de la LDC, en relación con la transferencia o no de control efectivo sobre los activos involucrados y el valor de estos atento los umbrales mínimos previstos en la LDC (conforme la excepción prevista en el artículo 10, inciso e) del mismo cuerpo normativo). Asimismo, consultan si el Acuerdo Marco y la posterior consolidación societaria generan por sí mismos la obligación de notificar, y en su caso, si deben notificarse de forma independiente.", "argumento_consultante": "Sostienen que el monto de la operación y el valor de los activos involucrados podrían no superar los umbrales previstos en el artículo 10, inciso e) de la LDC, lo que eximiría de la obligación de notificar; asimismo plantean dudas sobre si el Acuerdo Marco y la consolidación societaria constituyen operaciones autónomas sujetas a notificación.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja a la SECRETARÍA DE COMERCIO INTERIOR del MINISTERIO DE DESARROLLO PRODUCTIVO disponer que la operación descripta en el acápite II traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 8º de la Ley N.º 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El monto total de la operación de Cesión de Derechos Fiduciarios ($96.389.102,4) supera por sí solo el tope de $20.000.000 previsto para la excepción del artículo 10 inciso e), y además dicha cesión y el posterior Acuerdo Marco de Socios y Consolidación Societaria configuran una única operación de concentración por su vinculación funcional y cercanía temporal, que implica un cambio de control conjunto sobre las sociedades de los Grupos Farmaplus y Azul.", "causa_criterio": "monto_de_activos_bajo_umbral | control_ya_preexistente | otro", "hecho_determinante": "El precio total de la Cesión de Derechos Fiduciarios de los Fideicomisos PAS, GAB y JIS ascendió a $96.389.102,4, superando el tope de $20.000.000 previsto para la excepción del artículo 10 inciso e); adicionalmente, el Acuerdo Marco de Socios y Consolidación Societaria, suscripto tres días después de la Cesión, implica el cambio de control conjunto de MACULÁN, PASI y SEGURA sobre las Sociedades Grupo Farmaplus y Grupo Azul, antes controladas separadamente por distintos grupos de personas.", "fundamento_normativo": "Ley 25.156 art. 8 | Ley 25.156 art. 6 inc. c | Ley 25.156 art. 10 inc. e", "precedentes": "", "parrafos": "50 | 51 | 52 | 53 | 56 | 57 | 58 | 59", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 8", "Ley 25.156 art. 6 inc. c", "Ley 25.156 art. 10 inc. e"]}, {"OPI": "304", "archivo": "OPI-304.pdf", "expediente": "EX-2018-01085428- -APN-CME#MP", "ley": "25.156", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Las partes consultan si la adquisición por parte de ALPARAMIS del 100% de las acciones de HORKLA S.A., cuya única finalidad es la adquisición de tres inmuebles rurales en la provincia de Neuquén, se encuentra exenta de la obligación de notificación establecida en el Artículo 8° de la Ley N° 25.156, por no constituir una operación de concentración económica en los términos del Artículo 6 de dicha ley.", "argumento_consultante": "Los inmuebles adquiridos se encuentran en estado precario de conservación y no aptos para explotación económica alguna, por lo que HORKLA no tiene participación en ningún mercado real o potencial ni genera un volumen de negocios independiente, con clientela y valor propios.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas en los párrafos que anteceden, esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN disponer que la operación traída a consulta se encuentra exenta de la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156, por aplicación de lo dispuesto en el Artículo 10, inciso d) de la ley indicada.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La sociedad adquirida (HORKLA) solo poseía tres fracciones de campo sin actividad económica, en estado precario de conservación, que no generaron ganancias en los últimos tres años ni un volumen de negocios independiente con clientela y valor propios, por lo que se la considera una 'empresa liquidada' en sentido económico a los fines de la excepción del art. 10 inc. d).", "causa_criterio": "otro", "hecho_determinante": "HORKLA S.A. solo era titular de tres fracciones de campo sin explotación sustentable, sin contratos con terceros, con solo 3 empleados dedicados al cuidado y conservación de los inmuebles, y sin generar ganancias en los últimos tres años, lo que llevó a considerarla una 'empresa liquidada' a efectos económicos, aun cuando la operación jurídicamente implicaba la adquisición de acciones de una sociedad y no simplemente de un inmueble.", "fundamento_normativo": "Ley 25.156 art. 10 inc. d | Ley 25.156 art. 6 inc. c", "precedentes": "OPI Nº 83 | OPI Nº 237 | OPI Nº 138 | OPI Nº 279", "parrafos": "42 | 43 | 44 | 46 | 47", "confianza": "alta", "alertas_automaticas": "criterio = otro ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. d", "Ley 25.156 art. 6 inc. c"]}, {"OPI": "305", "archivo": "OPI-305.pdf", "expediente": "EX-2018-01483672- -APN-CME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Las partes consultantes entienden que la operación aquí informada no estaría sujeta a la obligación de notificar establecida en el Artículo 8º de la Ley Nº 25.156, por cuanto se encuadraría en la excepción establecida en el inciso c) del Artículo 10 de la misma norma, toda vez que, con anterioridad a la transacción, NUTRIEN no era titular de activos ni acciones en sociedades en Argentina.", "argumento_consultante": "La operación no genera efectos en la República Argentina, ya que NUTRIEN simplemente ocupa la posición que ARGIUM ya tenía respecto de PROFERTIL S.A., AGROSERVICIOS PAMPEANOS S.A. y CANPOTEX LTD, sin modificar el panorama competitivo ni crear nuevas relaciones económicas en el país.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA CON VOTO DE SU MAYORÍA aconseja a la Señora SECRETARIA DE COMERCIO del MINISTERIO DE PRODUCCIÓN Y TRABAJO disponer que la operación traída a consulta, consistente en la creación de la sociedad NUTRIEN LTD como compañía matriz tanto de ARGIUM INC. como de POTASH CORPORATION OF SASKATCHEWAN INC. y el consecuente cambio de control de las sociedades controladas previamente en forma exclusiva por los accionistas de ARGIUM INC. no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156, por no encuadrar en lo indicado por el Artículo 3° de la citada norma.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La operación no genera efectos nuevos en el mercado nacional argentino, ya que NUTRIEN simplemente sustituye a ARGIUM en las participaciones que esta ya tenía sobre PROFERTIL S.A., AGROSERVICIOS PAMPEANOS S.A. y CANPOTEX LTD, sin que POTASH CORP aporte activos, subsidiarias ni relaciones económicas nuevas en el país, por lo que no se configura el presupuesto de aplicación territorial extraterritorial (doctrina de los efectos) exigido por el artículo 3° de la Ley 25.156.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial | otro", "hecho_determinante": "POTASH CORP no posee activos ni subsidiarias en Argentina, y su único vínculo con el país era su participación del 33% en CANPOTEX LTD (igual a la que ya tenía ARGIUM), por lo que tras la fusión NUTRIEN solo ocupa la posición previa de ARGIUM sin generar nuevas relaciones ni efectos económicos en el mercado argentino.", "fundamento_normativo": "Ley 25.156 art. 3 | Ley 25.156 art. 8", "precedentes": "", "parrafos": "23 | 24 | 25 | 26 | 27", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 3", "Ley 25.156 art. 8"]}, {"OPI": "306", "archivo": "OPI-306.pdf", "expediente": "EX-2018-01754436-APN-CME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Determinar si la adquisición por PROCASTOR HOLDING S.A. del 50% de las acciones de PENTLAND CHAUSSURES LIMITED en manos de PENTLAND GROUP PLC se encuentra exenta de la obligación de notificación del artículo 8° de la Ley 25.156, por no encuadrar en el artículo 6° (Joint Venture no autónomo) o por aplicación de la excepción del artículo 10 inciso e).", "argumento_consultante": "El Joint Venture creado (PCL) continuaría diseñando y fabricando calzado Lacoste pero solo vendería a distribuidores designados por LACOSTE, por lo que se trataría de un Joint Venture No Autónomo sin volumen de negocios propio, y además el valor de los activos transferidos en Argentina no superaría los umbrales del art. 10 inc. e).", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Se recomienda disponer que la operación consistente en la adquisición por PROCASTOR HOLDING S.A. del 50% de las acciones de PENTLAND CHAUSSURES LIMITED en manos de PENTLAND GROUP PLC no se encontraría sujeta a la obligación de notificación establecida en el derogado Artículo 8° de la Ley 25.156, normativa considerada aplicable según el criterio de la Dirección General de Asuntos Jurídicos.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "El Joint Venture PCL no puede considerarse autónomo porque, conforme al Acuerdo de Licencia, carece de capacidad para generar su propio volumen de negocios y clientela independiente de PROCASTOR y PENTLAND, ya que solo puede vender los productos a distribuidores designados por LACOSTE, empresa controlada por PROCASTOR.", "causa_criterio": "otro", "hecho_determinante": "El Acuerdo de Licencia entre PROCASTOR y PCL establece un régimen de exclusividad por el cual PCL solo puede diseñar, fabricar y vender calzado Lacoste a distribuidores designados de antemano por LACOSTE OPERATIONS S.A. (controlada por PROCASTOR), lo que impide que el JV opere con clientela propia independiente, quitándole autonomía funcional.", "fundamento_normativo": "Ley 25.156 art. 6 | Ley 25.156 art. 8 | Ley 25.156 art. 10 inc. e", "precedentes": "OPI 282", "parrafos": "21 | 22 | 23 | 25", "confianza": "media", "alertas_automaticas": "criterio = otro ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 6", "Ley 25.156 art. 8", "Ley 25.156 art. 10 inc. e"]}, {"OPI": "307", "archivo": "OPI-307.pdf", "expediente": "EX-2018-04561691- -APN-CME#MP", "ley": "25.156", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Determinar si la operación por la cual SYNGENTA adquiere el Negocio de Semillas de NIDERA (ambas SOEs de la RPC controladas a través de la SASAC) se encuentra sujeta a la obligación de notificación establecida en el Artículo 8° de la Ley 25.156, dado que implicaría un cambio de control.", "argumento_consultante": "Las partes sostuvieron que la injerencia de la SASAC sobre las SOEs es asimilable a la de un simple accionista, sin intervención en la gestión comercial, por lo que las SOEs son agentes económicos independientes y la operación configuraría un cambio de control notificable.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al Señor SECRETARIO DE COMERCIO disponer que la operación traída a consulta consistente en la adquisición por parte de SYNGENTA CROP PROTECTION AG del Negocio de Semillas de NIDERA B.V. se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "La industria involucrada no integra el listado de sectores estratégicos para la RPC, y la SASAC no tiene injerencia en la estrategia comercial, presupuesto o plan de negocios de las SOEs, por lo que —conforme al principio de realidad económica— NIDERA y SYNGENTA operaban y se administraban de forma independiente antes de la operación, siendo agentes económicos independientes que pasarían a estar bajo control común.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial | otro", "hecho_determinante": "La SASAC, órgano estatal que ejerce el control de la RPC sobre SYNGENTA y NIDERA, no interviene en la gestión comercial, presupuesto o plan de negocios de dichas SOEs, y el sector de semillas no figura entre las industrias consideradas estratégicamente importantes para la RPC.", "fundamento_normativo": "Ley 25.156 art. 8 | Ley 25.156 art. 3", "precedentes": "Dictamen CNDC Nº 946 | Conc. 1476 - BARRICK CAYMAN", "parrafos": "24", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 8", "Ley 25.156 art. 3"]}, {"OPI": "308", "archivo": "OPI-308.pdf", "expediente": "EX-2018-07254039- -APN-CME#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Si la adquisición por parte de PSE del 12,6833% de las acciones clase B de SKANEU en manos de COSERPET encuadra en la excepción del inciso a) del artículo 10 de la Ley N° 25.156, dado que el comprador ya era titular de más del 50% del capital social de la firma objeto.", "argumento_consultante": "PSE ya poseía el 51% del capital social y el control exclusivo de SKANEU en virtud del Convenio de Accionistas, por lo que la operación encuadra en la excepción del art. 10 inc. a); subsidiariamente, sostienen que dicha excepción procede aun cuando hubiera un cambio en la naturaleza del control.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja a la SEÑORA SECRETARIA DE COMERCIO INTERIOR disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "PSE ya era titular del 51% del capital social y votos de SKANEU antes de la operación, y del Convenio de Accionistas surge que ejercía el control exclusivo de la firma (designación de mayoría del Directorio y de las autoridades clave), sin que los accionistas minoritarios tuvieran poder real de incidir en las decisiones, limitándose sus derechos a la protección de su inversión.", "causa_criterio": "control_ya_preexistente", "hecho_determinante": "El comprador PSE poseía previamente el 51% de las acciones y votos de SKANEU, y el Convenio de Accionistas le otorgaba control exclusivo (mayoría del Directorio, designación de autoridades clave), sin que los minoritarios tuvieran capacidad de incidir en la gestión.", "fundamento_normativo": "Ley 25.156 art. 10 inc. a", "precedentes": "OPI 13/2000 | OPI 18/2000 | OPI 63/2000 | OPI 129/2001 | OPI 144/2001 | OPI 172", "parrafos": "16 | 18 | 21 | 22 | 25", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. a"]}, {"OPI": "309", "archivo": "OPI-309.pdf", "expediente": "EX-2018-08744195- -APN-CME#MP", "ley": "25.156", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Las partes consultan si la adquisición por JUNCADELLA y PROSEGUR HOLDING del 100% de las acciones de TELLEX S.A., propiedad de PROSEGUR GLOBAL SIS y PROSEGUR INTERNATIONAL, aunque supera los umbrales de notificación, no generaría una toma de control en los términos del Artículo 6° de la Ley 25.156.", "argumento_consultante": "La transferencia accionaria constituye una reorganización societaria dentro del mismo Grupo Prosegur, sin alterar la estructura final de control de TELLEX.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "Compradoras y vendedoras se encontraban, ambas y de forma previa a la operación, indirectamente controladas por la misma firma, PROSEGUR COMPAÑÍA DE SEGURIDAD S.A., por lo que la operación no implica un cambio en la estructura de control sino una reorganización interna del grupo.", "causa_criterio": "reorganizacion_intragrupo_sin_cambio_de_control", "hecho_determinante": "Los organigramas del Grupo Prosegur y las fuentes públicas consultadas mostraron que tanto JUNCADELLA y PROSEGUR HOLDING (compradoras) como PROSEGUR GLOBAL SIS y PROSEGUR INTERNATIONAL (vendedoras), junto con TELLEX, estaban indirectamente controladas por PROSEGUR COMPAÑÍA DE SEGURIDAD S.A. antes de la operación.", "fundamento_normativo": "Ley 25.156 art. 6 inc. c | Ley 25.156 art. 8", "precedentes": "OPI 6/1999 | OPI 15/2000 | OPI 19/2000 | OPI 21/2000 | OPI 36/2000", "parrafos": "21 | 22 | 23 | 24", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 6 inc. c", "Ley 25.156 art. 8"]}, {"OPI": "310", "archivo": "OPI-310.pdf", "expediente": "EX-2018-14010826- -APN-DGD#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la adquisición por CP RENOVABLES S.A. del 100% de las acciones de VIENTOS LA GENOVEVA S.A. se encuentra exenta de la obligación de notificación del art. 8° de la Ley 25.156, por (i) quedar fuera del alcance del art. 6°, al no ser los activos transferidos suficientes para generar actividad económica ni un volumen de negocios independiente, y (ii) encuadrar en la excepción de empresa liquidada del art. 10 inciso d).", "argumento_consultante": "La firma objeto (VLG) no había registrado actividad económica ni ingresos desde su constitución, encontrándose en etapa preliminar e inoperativa, por lo que debía equipararse a una empresa liquidada en los términos del art. 10 inc. d) de la Ley 25.156, y sus activos no alcanzaban para generar un volumen de negocios independiente.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA, con su actual integración, recomienda disponer que la operación traída a consulta, consistente en la adquisición por CP RENOVABLES S.A. del 100% de las acciones de VIENTOS LA GENOVEVA, se encuentra sujeta a la obligación de notificación establecida en el artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "", "causa_criterio": "otro", "hecho_determinante": "El dictamen complementario, emitido por una nueva integración de la Comisión, revierte la conclusión del dictamen original (que eximía la operación por encuadrar en la excepción de empresa liquidada) y remite a lo dispuesto en la providencia PV-2020-45894854-APN-SSPMI#MDP, sin desarrollar en el texto disponible los fundamentos específicos del cambio de criterio.", "fundamento_normativo": "Ley 25.156 art. 8", "precedentes": "", "parrafos": "26", "confianza": "baja", "alertas_automaticas": "sin ratio_decidendi ; criterio = otro ; confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 8"]}, {"OPI": "311", "archivo": "OPI-311.pdf", "expediente": "EX-2018-17681565- -APN-DGD#MP", "ley": "25.156", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Las consultantes preguntan si la adquisición por parte de WEST CORPORATION del ‘Negocio Adquirido’ de NASDAQ INC. se encuentra sujeta a la obligación de notificación del Artículo 8º de la Ley 25.156, invocando que encuadraría en la excepción del inciso e) del Artículo 10, y que además no produciría efectos en el mercado argentino conforme el Artículo 3º.", "argumento_consultante": "El Negocio Adquirido no tiene activos en Argentina y su única presencia en el país es a través de ventas directas de monto reducido, por lo que la operación no produciría efectos en el mercado nacional conforme el Artículo 3º de la LDC.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta, consistente en la adquisición por parte de WEST CORPORATION de las subsidiarias de NASDAQ INC. denominadas NASDAQ CORPORATE SOLUTIONS CANADA ULC, MW HOLDCO (2006) INC., MARKETWIRE INC., MARKETWIRED UK LIMIED y DIANUM LLC, y ciertos contratos, licencias y activos asociados, no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "eximicion_de_traduccion_publica", "CAUSA_ratio_decidendi": "La operación no conlleva efectos en el mercado nacional porque las exportaciones del Negocio Adquirido a Argentina, si bien habituales por mantenerse constantes en los últimos tres años, no resultan sustanciales por su bajo monto, faltando así el nexo de efectos que exige el Artículo 3º para someter la operación al deber de notificar del Artículo 8º.", "causa_criterio": "otro", "hecho_determinante": "El Negocio Adquirido carece de activos situados en Argentina y su única presencia en el país consiste en exportaciones directas de montos bajos (entre USD 83.524 y USD 91.295 anuales en los últimos tres años), consideradas habituales y previsibles pero no sustanciales.", "fundamento_normativo": "Ley 25.156 art. 3 | Ley 25.156 art. 8", "precedentes": "", "parrafos": "19 | 20 | 21", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 3", "Ley 25.156 art. 8"]}, {"OPI": "312", "archivo": "OPI-312.pdf", "expediente": "EX-2018-20315966- -APN-DGD#MP", "ley": "25.156", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Las consultantes solicitan que se determine si la adquisición por parte de CT INSURETECH y CT INSURANCE del 100% de las acciones de INWORX ARGENTINA y SOFTSEG se encuentra exenta de la obligación de notificación del Artículo 8° LDC, por encuadrar en la excepción del inciso c) del Artículo 10 de la Ley 25.156.", "argumento_consultante": "Se trata de la adquisición de una única empresa argentina por una empresa extranjera que no posee previamente activos o acciones de otras empresas en Argentina, ya que la sociedad local del grupo comprador (Charles Taylor S.A.) no tiene actividad comercial ni impacto económico en el país.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación consistente en la adquisición por parte de CHARLES TAYLOR INSURETECH LIMITED y CHARLES TAYLOR INSURANCE SERVICES LIMITED del 100% de las acciones de INWORX ARGENTINA S.A. y SOFTSEG S.A. no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156, conforme lo previsto en el inciso c) del Artículo 10 de la referida norma.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La sociedad argentina preexistente del grupo comprador, Charles Taylor S.A., fue constituida únicamente para dar base territorial a tres empleados sin actividad comercial ni facturación, por lo que no implicó que el grupo comprador poseyera previamente activos o acciones de otras empresas en Argentina, configurándose así la excepción del Art. 10 inc. c).", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "Charles Taylor S.A., empresa argentina del grupo comprador constituida en febrero de 2017, no tuvo actividad comercial ni facturación, sirviendo solo de base a tres empleados sin impacto económico en el país.", "fundamento_normativo": "Ley 25.156 art. 10 inc. c", "precedentes": "", "parrafos": "24 | 25 | 26", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. c"]}, {"OPI": "313", "archivo": "OPI-313.pdf", "expediente": "EX-2018-06597078- -APN-CME#MP", "ley": "25.156", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Determinar si la operación por la cual SGRF (a través de EAGLE) adquiere el 61,5% del capital social de STAR, continuando APEF con el 38,5% restante, se encuentra sujeta a la obligación de notificación del Artículo 8° de la LDC.", "argumento_consultante": "Las partes sostienen que la operación encuadra en la excepción de «first landing» del Artículo 10 inciso c) de la Ley 25.156, ya que ni Omán, ni SGRF, ni EAGLE poseían previamente activos, acciones o intereses directos o indirectos en empresas argentinas ni contacto comercial con el país.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación consistente en la adquisición por parte de EAGLE NOVA INVESTMENTS LIMITED, empresa controlada por STATE GENERAL RESERVE FUND, del control conjunto sobre STAR BUSINESS ENTERPRISE LIMITED, con la compra del 61,5% de las acciones, no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "confidencialidad_concedida | otro", "CAUSA_ratio_decidendi": "Ni el Sultanato de Omán, ni SGRF (controlante de EAGLE), ni EAGLE poseían previamente activos, acciones o intereses directos o indirectos en empresas argentinas o extranjeras con operaciones en el país, ni tenían contacto comercial con Argentina, constituyendo la operación su primer ingreso al mercado local.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "SGRF y EAGLE no poseían previamente activos, acciones ni intereses en ninguna empresa argentina, ni contacto comercial directo o indirecto con el país, siendo la operación consultada su primer intento de ingreso a cualquier mercado argentino.", "fundamento_normativo": "Ley 25.156 art. 10 inc. c", "precedentes": "", "parrafos": "17 | 18", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. c"]}, {"OPI": "314", "archivo": "OPI-314.pdf", "expediente": "EX-2018-24165638- -APN-DGD#MP", "ley": "25.156", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Determinar si la adquisición por parte de CHINA TIANYING del control exclusivo de JIANGSU DEZHAN INVESTMENT CO., LTD (y por ende del control indirecto de URBASER S.A.U.) se encuentra exenta de la obligación de notificación por encuadrar en la exención del inciso c) del Artículo 10 de la Ley 25.156 (first landing).", "argumento_consultante": "El único punto de contacto indirecto del grupo comprador con la Argentina, previo a la transacción, es la participación minoritaria y no controlante que el Sr. Shengjun Yan posee en Urbaser a través de Jiangsu Dezhan, por lo que la operación constituye el primer desembarco de la compradora en el país.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja al Señor Secretario de Comercio Interior disponer que la operación traída a consulta, consistente en la adquisición por parte de China Tianying del control exclusivo de Jiangsu Dezhan Investment Co., LTD, no se encuentra sujeta a la obligación de notificación establecida en el Artículo 8º de la Ley Nº 25.156.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Ni CHINA TIANYING ni sus últimos controlantes (Shengjun Yan y Hongju Mao) poseían previamente participación directa, activos o control sobre empresas en Argentina; la única vinculación indirecta era una tenencia accionaria minoritaria y no controlante del 14,40% sobre Jiangsu Dezhan, insuficiente para descartar el carácter de primer desembarco en el país.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "El grupo comprador (China Tianying y sus controlantes últimos) no poseía activos, acciones ni control directo sobre empresas en Argentina antes de la operación; su único vínculo previo era una participación minoritaria y no controlante del 14,40% de las personas físicas controlantes sobre la sociedad china que a su vez controlaba Urbaser.", "fundamento_normativo": "Ley 25.156 art. 10 inc. c | Ley 25.156 art. 8", "precedentes": "", "parrafos": "39 | 40 | 41", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 25.156 art. 10 inc. c", "Ley 25.156 art. 8"]}, {"OPI": "315", "archivo": "OPI-315.pdf", "expediente": "EX-2018-25798398- -APN-DGD#MP", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Se consulta si la venta por parte de LEDESMA a CARGILL de un porcentaje entre un mínimo del 40% y hasta un máximo del 47,5% de las acciones de GLUCOVIL ARGENTINA se encuentra exenta de la obligación de notificación del Artículo 9° de la Ley 27.442, por no configurar una operación de concentración económica en los términos del Artículo 7°.", "argumento_consultante": "Las partes sostuvieron que no existiría una operación de concentración económica en los términos del Artículo 7° de la Ley 27.442, por lo que la transacción estaría exenta de la obligación de notificación.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta consistente en la venta por parte de LEDESMA S.A.A.I. a CARGILL SOUTH AMERICAN HOLDINGS L.P. de un porcentaje entre un mínimo del 40% y hasta un máximo del 47,5% de las acciones de GLUCOVIL ARGENTINA S.A., se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "La operación invirtió el esquema de co-control previo: LEDESMA, que era controlante desde 2009, pasó a ser controlante minoritario, mientras que CARGILL (junto con CORN MILLING) adquirió el 70% de las acciones y, mediante el nuevo acuerdo de accionistas, el poder de definir por mayoría absoluta en asamblea las materias especiales del directorio, incluyendo decisiones estratégicas como presupuesto y plan de inversiones, otorgándole control exclusivo sobre GLUCOVIL ARGENTINA.", "causa_criterio": "control_ya_preexistente", "hecho_determinante": "El acuerdo de accionistas modificado otorgó a CARGILL, luego de la operación, la titularidad de la mayoría absoluta en asamblea para decidir materias especiales del directorio (incluyendo presupuesto y plan de inversiones) en caso de falta de acuerdo, revirtiendo el esquema de control que hasta entonces detentaba LEDESMA.", "fundamento_normativo": "Ley 27.442 art. 6 | Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "OPI 124", "parrafos": "29 | 30 | 31 | 32 | 33", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 6", "Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "316", "archivo": "OPI-316.pdf", "expediente": "EX-2018-31345580-APN-DGD#MP,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "", "argumento_consultante": "", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA recomienda a la SEÑORA SECRETARIA DE COMERCIO INTERIOR DEL MINISTERIO DE DESARROLLO PRODUCTIVO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La CNDC, con su nueva composición, revisó íntegramente el dictamen previo del 9 de marzo de 2020 y no encontró observaciones que formular, por lo que ratificó sus conclusiones sin agregar fundamentos nuevos.", "causa_criterio": "otro", "hecho_determinante": "El texto no incluye los hechos ni el análisis sustantivo del dictamen original del 9 de marzo de 2020, solo remite y ratifica dicho dictamen sin reproducir su contenido.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "4", "confianza": "baja", "alertas_automaticas": "criterio = otro ; confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "317", "archivo": "OPI-317.pdf", "expediente": "EX-2018-33105748- -APN-DGD#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la operación del 3 de julio de 2018, consistente en la transferencia de Acciones Clase A de SUPERCABLECANAL S.A. a STANHOPE WORLDWIDE SERVICES, INC. e INTERNATIONAL CAPITAL MARKETS GROUP, y el subsiguiente cambio de control a favor del Sr. Daniel Eduardo VILA, se encuentra sujeta a la obligación de notificación del Artículo 9º de la Ley 27.442.", "argumento_consultante": "Las partes informaron que se produjo un cambio de control sucesivo y transitorio, dado que a los 14 días corridos las acciones fueron transferidas a un tercero (CVI AUSTRAL LLP), operación que ya fue notificada como CONC. 1647.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO del MINISTERIO DE PRODUCCIÓN disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El cambio de control operado el 3 de julio de 2018 no fue duradero, ya que a los 14 días corridos las acciones fueron transferidas a un tercero (CVI AUSTRAL LLP), operación ya notificada. Ese breve lapso no alcanza a generar una modificación permanente en la estructura de los mercados afectados, requisito exigido para configurar una concentración notificable.", "causa_criterio": "control_ya_preexistente", "hecho_determinante": "A los 14 días corridos de la operación consultada, las acciones de VILA y MANZANO en SUPERCABLECANAL S.A. fueron vendidas a CVI AUSTRAL LLP (cierre el 17/07/2018), notificada bajo CONC. 1647, evidenciando que el control transferido en la operación bajo consulta fue meramente transitorio.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 7", "precedentes": "CONC. 1647 | CONC. 1026", "parrafos": "45 | 46 | 47 | 48 | 49", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 7"]}, {"OPI": "318", "archivo": "OPI-318.pdf", "expediente": "EX-2018-37913775- -APN-DGD#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se solicitó opinión consultiva respecto de la obligación de notificar la posible adquisición por FME del 100% del capital social y derechos a voto de URC S.A., entendiendo los consultantes que la operación encuadraría en la excepción del artículo 11, inciso e), de la Ley 27.442 por el bajo valor del activo total de URC.", "argumento_consultante": "El activo total de URC es notoriamente inferior al umbral de $400.000.000 (20.000.000 UM) establecido en el artículo 11 inciso e) de la Ley 27.442 para la excepción a la obligación de notificar.", "respuesta_sentido": "abstracta_o_desistida", "respuesta_texto": "Disponer que la operación traída a consulta ha devenido en abstracta, siendo innecesario continuar con el tratamiento de la Opinión Consultiva.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "Las partes informaron que no llegaron a un acuerdo escrito relativo a la operación y que la operación no fue materializada, por lo que FME desistió tanto de la operación como de la opinión consultiva presentada.", "causa_criterio": "operacion_no_perfeccionada_o_desistida", "hecho_determinante": "FME informó que las partes involucradas no llegaron a un acuerdo escrito sobre la operación y que, al no haberse materializado, desistía de la operación y de la consulta.", "fundamento_normativo": "", "precedentes": "", "parrafos": "10 | 11 | 18", "confianza": "alta", "alertas_automaticas": "sin fundamento normativo", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": []}, {"OPI": "319", "archivo": "OPI-319.pdf", "expediente": "EX-2018-40175975- -APN-DGD#MP", "ley": "25.156 | 27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "El consultante remitió copia certificada de la inscripción del contrato de Agrupación de Colaboración Empresaria (AGIPSS) en el Registro de la IGJ, sosteniendo que la operación no califica como concentración económica en los términos del artículo 7° de la Ley N° 27.442.", "argumento_consultante": "El consultante entiende que la operación no configura una concentración económica bajo el artículo 7° de la Ley 27.442, por lo que solo pretendía informar la inscripción registral del contrato.", "respuesta_sentido": "otro", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja: a) Tener por no presentado el pedido de opinión consultiva en trámite, en virtud de lo dispuesto por el punto a.3) del Anexo a la Resolución N° 26/2006; b) Ordenar la apertura de una Diligencia Preliminar a los efectos de determinar si la celebración del Contrato de Agrupación se encuentra o no sujeta a la obligación de ser notificada.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "El consultante no suministró la información y documentación requerida por la CNDC en tiempo y forma, pese a los sucesivos requerimientos notificados, ni brindó razones fundadas para no hacerlo, lo que conforme el Anexo I, Apartado a.3 de la Resolución SCT N° 26/2006 obliga a tener por no presentada la solicitud.", "causa_criterio": "otro", "hecho_determinante": "El consultante no respondió a los requerimientos de información efectuados por la CNDC el 7 de agosto de 2018 y reiterados el 7 de enero de 2020, transcurriendo holgadamente el plazo de 5 días previsto en la normativa sin cumplimiento ni justificación.", "fundamento_normativo": "Resolución SCT N° 26/2006 art. Anexo I, a.3", "precedentes": "OPI 298 | OPI 300", "parrafos": "15 | 16 | 17 | 18", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Resolución SCT N° 26/2006 art. Anexo I, a.3"]}, {"OPI": "320", "archivo": "OPI-320.pdf", "expediente": "EX-2018-48379483- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Se consulta si la introducción de ciertas modificaciones al acuerdo de Joint Venture AEROLOGIC entre LCAG y DPBH, relativas a la incorporación de Aeronaves Adicionales y la reestructuración de disposiciones sobre Aeronaves Existentes, implica una operación de concentración económica sujeta a notificación.", "argumento_consultante": "Las partes sostienen que las modificaciones al acuerdo de JV no alteran las participaciones accionarias (50%-50%) ni la estructura de control conjunto preexistente sobre AEROLOGIC.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional aconseja disponer que la operación traída a consulta consistente en la introducción de ciertas modificaciones al acuerdo de Joint Venture AEROLOGIC, no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "confidencialidad_concedida", "CAUSA_ratio_decidendi": "Las participaciones accionarias de LCAG y DPBH en AEROLOGIC continúan siendo del 50% cada una tras la modificación, manteniéndose el co-control conjunto en partes iguales, sin que la operación implique toma de control sobre activos sujetos a notificación ni un cambio en la naturaleza del control preexistente.", "causa_criterio": "control_ya_preexistente", "hecho_determinante": "Las modificaciones al acuerdo de JV mantienen inalteradas las participaciones accionarias del 50% de cada parte y no implican cambio de control sobre AEROLOGIC, que continúa siendo controlada conjuntamente en partes iguales.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "", "parrafos": "38 | 39 | 40 | 41 | 42", "confianza": "alta", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "321", "archivo": "OPI-321.pdf", "expediente": "EX-2018-50442992- -APN-DGD#MPYT", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Se consulta si la adquisición por parte de DIA a WALMART de 14 contratos de locación de locales con sus bienes de uso y los contratos de trabajo de 50 empleados se encuentra exenta de la obligación de notificar, por encuadrar en la excepción del inciso e) del artículo 11 de la Ley 27.442.", "argumento_consultante": "El monto de la operación y el valor de los activos transferidos son inferiores al umbral de 20.000.000 de unidades móviles, y DIA no realizó en los últimos 12 ni 36 meses operaciones que en conjunto superen dicho importe.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El monto de la operación ($47.240.280) y el valor de los activos transferidos (estimado en $25.000.000) resultan inferiores al umbral de 20.000.000 de unidades móviles ($400.000.000), y las partes declararon no haber realizado en los últimos 12 y 36 meses operaciones que en conjunto superen dichos topes legales.", "causa_criterio": "monto_de_activos_bajo_umbral", "hecho_determinante": "El monto de la operación y el valor de los activos situados en Argentina que se transfieren se encuentran por debajo del umbral de 20.000.000 de unidades móviles, sin que se hayan superado los topes acumulados en 12 ni 36 meses.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9 | Ley 27.442 art. 85", "precedentes": "", "parrafos": "12 | 13 | 14 | 15 | 16", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 85"]}, {"OPI": "322", "archivo": "OPI-322.pdf", "expediente": "EX-2017-12136585-APN-DDYME#MP", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Los consultantes preguntan si el cambio de la sociedad controlante de AACR, producido por un aporte de capital en especie de CENTRAL TUCUMANO que la convierte en nueva controlante en reemplazo de AEROPOST ARGENTINA, se encuentra exenta de la obligación de notificar en los términos del Artículo 11, incs. a) y e) de la Ley 27.442.", "argumento_consultante": "La operación implica un cambio de controlante formal, pero tanto la sociedad controlante saliente como la entrante pertenecen al mismo grupo económico, controlado en última instancia por el mismo accionista final, por lo que no habría una verdadera toma de control en los términos del Artículo 7° de la Ley 27.442, y además el monto de la capitalización no supera el umbral del Artículo 11 inc. e).", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional aconseja disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el Artículo 9º de la Ley Nº 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Del análisis de los organigramas aportados surge que tanto la parte compradora como la vendedora están indirectamente controladas por la misma firma (ALCURA) y en última instancia por la misma persona física (Alejandro Tomás Crespo). Por tratarse de una reorganización interna dentro de un mismo grupo económico, no hay un cambio real en la estructura de control y, por ende, no configura una toma de control en los términos del Artículo 7°.", "causa_criterio": "reorganizacion_intragrupo_sin_cambio_de_control", "hecho_determinante": "AEROPOST ARGENTINA (controlante saliente de AACR) y CENTRAL TUCUMANO (nueva controlante) se encuentran ambas controladas indirectamente por ALCURA y, en última instancia, por el mismo accionista, Alejandro Tomás Crespo, por lo que la operación no altera el control final del grupo.", "fundamento_normativo": "Ley 27.442 art. 7 inc. c | Ley 27.442 art. 9", "precedentes": "OPI 6/1999 | OPI 15/2000 | OPI 19/2000 | OPI 21/2000 | OPI 36/2000", "parrafos": "22 | 23", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. c", "Ley 27.442 art. 9"]}, {"OPI": "323", "archivo": "OPI-323.pdf", "expediente": "EX-2018-58666455- -APN-DGD#MPYT", "ley": "25.156 | 27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "Los consultantes preguntan si la cesión por GAS Y PETRÓLEO a IEASA de su participación en la concesión de explotación del área «Aguada del Chañar», junto con la nueva concesión no convencional otorgada por la provincia de Neuquén, están exceptuadas de notificación por tratarse de una empresa sin actividad registrada en el país en el último año (art. 11 inc. d, Ley 27.442).", "argumento_consultante": "El área tiene la producción paralizada hace más de veinte meses, por lo que
