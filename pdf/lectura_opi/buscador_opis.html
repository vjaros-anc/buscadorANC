sultante": "", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que las operaciones traídas a consulta no se encuentran sujetas a la obligación de notificación establecida en el artículo 9° de la Ley N.º 27.442.", "medidas_accesorias": "comunicacion_aplicacion_resolucion_26_2006_punto_a1 | advertencia_sobre_veracidad_de_hechos_relatados", "CAUSA_ratio_decidendi": "", "causa_criterio": "otro", "hecho_determinante": "La sección de ANÁLISIS del dictamen no fue provista en el documento (consta como “sin datos”), por lo que no puede identificarse con precisión el hecho concreto que fundamentó la aplicación del criterio. Del relato de hechos surge que QUALITY estaba previamente controlada de forma conjunta por EFESUL e IRSA, y tras la operación pasa a ser controlada conjuntamente por EFESUL y CONSTRUIR.", "fundamento_normativo": "Ley 27.442 art. 9 | Resolución 26/2006 (ex Secretaría de Coordinación Técnica) art. a.1", "precedentes": "", "parrafos": "54", "confianza": "baja", "alertas_automaticas": "sin ratio_decidendi ; criterio = otro ; confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Resolución 26/2006 (ex Secretaría de Coordinación Técnica) art. a.1"]}, {"OPI": "360", "archivo": "OPI-360.pdf", "expediente": "EX-2023-118711905- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La parte consultante plantea que la transacción, consistente en la adquisición del 19,9% de las acciones y votos de ARGENTINA LITIO Y ENERGÍA S.A. por parte de PEUGEOT CITROËN ARGENTINA S.A., no se encuentra sujeta a la notificación obligatoria prevista en el artículo 9° de la Ley 27.442, por no constituir una concentración económica en los términos del artículo 7°.", "argumento_consultante": "El comprador no adquiere control sobre la compañía objeto, ya que el vendedor conserva el 80,1% del capital y votos, la estructura societaria no otorga facultades de dirección o bloqueo, y las mayorías especiales y derechos de información sólo protegen la inversión del accionista minoritario.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE COMERCIO disponer que la operación traída a consulta, que consiste en la adquisición del 19,9% de las acciones y votos de ARGENTINA LITIO Y ENERGÍA S.A. por parte de PEUGEOT CITROËN ARGENTINA S.A., no se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La participación adquirida por PCA es minoritaria (19,9%) y el vendedor conserva el control mediante mayorías alcanzables por sí solo en las asambleas ordinaria y extraordinaria. Las conformidades requeridas a PCA en el Directorio y sus derechos de información apuntan a proteger su inversión, no a otorgarle facultades sobre la estrategia competitiva de la empresa objeto, por lo que PCA no adquiere control ni influencia sustancial sobre la compañía.", "causa_criterio": "participacion_minoritaria_pasiva | ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "PCA adquiere el 19,9% de las acciones y votos, mientras que el vendedor conserva el 80,1% y las mayorías necesarias en asambleas; las conformidades exigidas a PCA en el Directorio y su derecho de información se limitan a proteger su inversión, sin conferirle facultades sobre la estrategia comercial de la empresa objeto.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "", "parrafos": "22 | 23 | 24 | 25 | 26 | 27 | 29 | 30", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "361", "archivo": "OPI-361.pdf", "expediente": "EX-2023-141435441--APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la adquisición por parte de MB CAMIONES de 3 unidades funcionales de oficinas y 42 de cocheras, junto con la cesión plena de contratos de locación con Biogen Argentina S.R.L. y TPCG Valores S.A.U., configura una operación de concentración económica sujeta a notificación.", "argumento_consultante": "", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja al Señor Secretario de Comercio del Ministerio de Economía disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "", "causa_criterio": "otro", "hecho_determinante": "El documento no incluye la sección de ANÁLISIS, por lo que no surge del texto el razonamiento específico que llevó a considerar la operación sujeta a notificación.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "28", "confianza": "baja", "alertas_automaticas": "sin ratio_decidendi ; criterio = otro ; confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "362", "archivo": "OPI-362.pdf", "expediente": "EX-2024-12165884- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si un contrato a façon mediante el cual VICENTIN presta a BUNGE, ACA y VITERRA el servicio de procesamiento de semilla de girasol en su Planta Industrial, para obtener aceite crudo y pellets, se encuentra sujeto a notificación obligatoria.", "argumento_consultante": "Las Consultantes sostienen que la operación no implica toma de control ni adquisición de influencia sustancial sobre la política comercial de VICENTIN, ya que ellas utilizan sus propias semillas, comercializan a su propia clientela, VICENTIN conserva la titularidad y disposición de la Planta Industrial (usándola en paralelo para otro cliente) y el contrato tiene un plazo acotado de seis meses renovable por otros seis.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE INDUSTRIA Y COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El contrato de façon no implica transferencia de activos ni adquisición de influencia sustancial o determinante sobre la estrategia competitiva de VICENTIN, dado que ésta conserva la titularidad y libre disposición de la Planta Industrial —utilizándola en paralelo para otro cliente—, mientras que las Consultantes procesan sus propias semillas y comercializan a su propia clientela, sin injerencia de VICENTIN, en un contrato de plazo acotado.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "VICENTIN mantiene la titularidad y disposición de la Planta Industrial, utilizándola simultáneamente para prestar servicios a un tercero (Unión Agrícola Avellaneda), y el contrato de façon tiene un plazo de seis meses renovable, sin que las Consultantes adquieran injerencia sobre la política comercial de VICENTIN ni ésta sobre la de aquéllas.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 7 inc. e | Ley 27.442 art. 9", "precedentes": "", "parrafos": "33 | 34 | 35 | 36 | 25 | 26 | 27", "confianza": "media", "alertas_automaticas": "voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 7 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "363", "archivo": "OPI-363.pdf", "expediente": "EX-2024-30401799- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si un contrato a façon mediante el cual VICENTIN (y OLEAGINOSA SAN LORENZO S.A.) prestará a BUNGE, ACA y VITERRA servicios de recepción, descarga, manipuleo, acondicionamiento, almacenaje y molienda de poroto de soja en la Planta San Lorenzo se encuentra sujeto a notificación obligatoria.", "argumento_consultante": "Las consultantes sostienen que no hay toma de control porque VICENTIN conserva la titularidad y libre disposición de sus negocios, los Inversores Estratégicos utilizan porotos propios y comercializan con su propia clientela, y el plazo del contrato (11 meses, renovable por 2) no es lo suficientemente prolongado como para afectar el mercado.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE INDUSTRIA Y COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Aunque existe un contrato pendiente de ejecución que eventualmente podría otorgar control sobre los activos de la Planta San Lorenzo, el contrato de façon en sí mismo no genera un cambio duradero del control sobre empresa alguna, dado su carácter transitorio y limitado a la prestación de servicios industriales sin transferencia de injerencia sobre la política comercial de las partes.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El contrato a façon tiene un plazo limitado (11 meses, renovable por 2), no otorga a VICENTIN injerencia sobre la política comercial de los Inversores Estratégicos ni viceversa, y estos últimos utilizan poroto propio y venden a su propia clientela, sin que se transfiera control duradero sobre la Planta San Lorenzo.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "", "parrafos": "38 | 39", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "364", "archivo": "OPI-364.pdf", "expediente": "EX-2020-60005227- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Si la emisión de acciones con derecho especial de voto a favor de EXOR en STELLANTIS (que elevó su participación en votos del 14,46% al 23,13%) constituye una operación sujeta a notificación obligatoria en los términos del artículo 9° de la Ley 27.442.", "argumento_consultante": "La emisión de acciones con voto especial no constituye adquisición de control o influencia sustancial en los términos del artículo 7°, ya que EXOR no podrá aprobar ni bloquear resoluciones estratégicas ni la destitución de directores, y sus derechos de nominación al directorio no se modificaron respecto de lo pactado en el Combination Agreement.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442, y hacer saber que la opinión se emite valorando como sustento fáctico la descripción realizada en los escritos del expediente, por lo que su inexactitud o modificación tornaría inaplicables los conceptos vertidos.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Pese al aumento de votos, EXOR no reúne quórum ni mayoría suficiente en directorio ni en asamblea, no tiene facultades de veto ni de designación de personal clave, y existe un tope estatutario del 30% de votos, por lo que no adquirió control ni influencia sustancial sobre STELLANTIS.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El aumento de derechos de voto de EXOR (de 14,46% a 23,13%) no le otorga quórum ni mayoría en el directorio (4 de 11 directores) ni en la asamblea, no tiene facultad de desempate ni de designar personal clave, y el estatuto limita el ejercicio de voto a un máximo del 30%.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "Conc. 1753", "parrafos": "22 | 23 | 25 | 26 | 28 | 29", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "366", "archivo": "OPI-366.pdf", "expediente": "EX-2024-69113499- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la adquisición del control conjunto sobre TERMINAL PUERTO ROSARIO S.A. por parte de INVERSIONES PORTUARIAS ANDINAS LIMITADA, mediante la conversión de acciones preferidas en ordinarias con derecho a voto, se encuentra sujeta a la obligación de notificación del artículo 9 de la Ley 27.442.", "argumento_consultante": "La parte consultante sostiene que, si bien la operación constituye una concentración económica, el volumen de negocios de las empresas afectadas no supera el umbral aplicable, por lo que no correspondería notificar.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley 27.442.", "medidas_accesorias": "remision | aplicacion_resolucion_26_2006_punto_a1", "CAUSA_ratio_decidendi": "El volumen de negocios total de las empresas afectadas por la operación, calculado en base a las subsidiarias locales de ULTRAMAR relevantes (LOGÍSTICA RÍO ARRIBA, PLAYA PUERTO, BRINGS AUSTRAL, AGENCIA MARÍTIMA BRINGS, entre otras), no supera el umbral legal aplicable al período correspondiente.", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "La conversión de acciones preferidas en ordinarias con derecho a voto que otorga a IPAL el 50% de las acciones ordinarias de TPR, pero cuyo volumen de negocios agregado de las empresas afectadas no alcanza el umbral establecido.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "17 | 18 | 19", "confianza": "baja", "alertas_automaticas": "confianza baja ; voto particular / complementario", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "367", "archivo": "OPI-367.pdf", "expediente": "EX-2024-84332203- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Las Consultantes solicitaron opinión respecto de si la adquisición del control conjunto sobre URUS GROUP LP por parte de CVC CAPITAL PARTNERS PLC se encuentra sujeta a la obligación de notificación del artículo 9° de la Ley 27.442, entendiendo que el volumen de negocios no supera el umbral legal.", "argumento_consultante": "El volumen de negocios de las firmas afectadas por la operación no supera el umbral de cien millones de unidades móviles establecido en el artículo 9° de la Ley 27.442.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "se_declara_abstracta_la_solicitud_de_suspension_de_plazo", "CAUSA_ratio_decidendi": "El volumen de negocios total de las empresas afectadas (CVC y URUS y sus respectivos grupos) asciende a AR$ 46.757.287.220,72, monto que se encuentra por debajo del umbral de cien millones de unidades móviles vigente al momento del cierre de la operación (AR$ 50.619.000.000,00).", "causa_criterio": "umbral_de_volumen_no_alcanzado", "hecho_determinante": "La sumatoria del volumen de negocios de las empresas afectadas por la operación resultó inferior al umbral legal aplicable al período correspondiente.", "fundamento_normativo": "Ley 27.442 art. 9", "precedentes": "", "parrafos": "21 | 22", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9"]}, {"OPI": "368", "archivo": "OPI-368.pdf", "expediente": "EX-2024-110951912 -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La parte consultante entiende que el acuerdo de gerenciamiento entre la FUNDACIÓN FAVALORO y BASA no puede considerarse una concentración económica en los términos del artículo 7° de la LDC, dado que no supone la adquisición de control sobre la FUNDACIÓN ni el HOSPITAL UNIVERSITARIO.", "argumento_consultante": "La Comisión Directiva de la FUNDACIÓN conserva funciones de control mediante rendición de cuentas y un Comité de Seguimiento de Gestión, por lo que la política comercial estratégica seguiría siendo instruida y monitoreada por la FUNDACIÓN, sin que BASA adquiera control.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE INDUSTRIA Y COMERCIO disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El Acuerdo otorga a BASA amplias facultades de dirección y administración general sobre el HOSPITAL UNIVERSITARIO, impidiendo a la FUNDACIÓN ejercer funciones de dirección directa mientras esté vigente; el monitoreo del Comité de Seguimiento no desvirtúa que la influencia determinante reside en BASA. Además, la duración de 15 años prorrogables implica un cambio de control duradero, y el monto de la operación supera el umbral de mínimis del art. 11 inc. e).", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El Acuerdo otorga a BASA las más amplias funciones de gerenciamiento integral (administración, gestión y prestación de servicios de salud), con exclusividad, manejo de fondos y cuentas, dirección del personal, y prohibición a la FUNDACIÓN de manejar fondos o realizar contrataciones sin autorización de BASA, por un plazo de 15 años prorrogable.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. e", "precedentes": "OPI 177", "parrafos": "40 | 41 | 42 | 51 | 54 | 57", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. e"]}, {"OPI": "369", "archivo": "OPI-369.pdf", "expediente": "EX-2024-112621830- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "BUNGE consulta si el contrato a façon mediante el cual VICENTIN le prestará servicios de recepción, molienda y almacenaje de Semillas Especiales de propiedad de BUNGE en la Planta Industrial de Ricardone se encuentra sujeto a notificación como concentración económica.", "argumento_consultante": "BUNGE sostiene que no existe toma de control: utilizará solo el 12% de la capacidad instalada de la Planta, VICENTIN mantiene la titularidad y disposición del resto, BUNGE conserva la comercialización de los productos, y el plazo del contrato (18 meses, renovable 3) no es lo suficientemente prolongado como para configurar control.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta Comisión Nacional de Defensa de la Competencia aconseja disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El contrato de façon no genera un cambio duradero del control sobre empresa alguna: BUNGE usa una porción minoritaria (12%) de la capacidad instalada de la Planta por un plazo acotado (18 meses, renovable 3), mientras VICENTIN conserva la titularidad y disposición del resto de los activos y BUNGE mantiene su propia comercialización, sin injerencia de VICENTIN.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "BUNGE utilizará únicamente el 12% de la capacidad instalada de la Planta Industrial por un plazo de 18 meses (renovable 3), conservando VICENTIN la titularidad y el 88% restante de la capacidad, y BUNGE conserva la comercialización de los productos sin injerencia de VICENTIN.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 7 inc. e | Ley 27.442 art. 9", "precedentes": "", "parrafos": "34 | 35", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 7 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "370", "archivo": "OPI-370.pdf", "expediente": "EX-2024-122871991- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "La parte consultante plantea si la constitución de FARMAOYTE S.A., a la que se transferirían los activos y contratos de administración de ACE-ONCOLOGÍA, se encuentra sujeta a la obligación de notificar como concentración económica, argumentando que no constituye un activo notificable, que no supera el umbral de volumen de negocios, y subsidiariamente que aplicaría la excepción de minimis del art. 11 inc. (e) de la LDC.", "argumento_consultante": "FARMAOYTE sería un joint venture no autónomo (mera administradora sin fines de lucro), no superaría el umbral de volumen de negocios, y subsidiariamente el monto de la operación y el valor de los activos transferidos estarían por debajo del umbral de minimis del artículo 11 inciso (e) de la LDC.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta se encuentra exenta de la obligación de notificación establecida en el artículo 9° de la Ley 27.442, de conformidad con lo establecido en el artículo 11, inciso (e), de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Si bien se verificó toma de control de un activo (constitución de un joint venture de plenas funciones) y el volumen de negocios superaba el umbral legal, tanto el monto de la operación (capital social) como el valor de los activos transferidos a FARMAOYTE resultaron inferiores al umbral de minimis, y no se registraron transacciones previas en el mismo mercado en los últimos 12 a 36 meses.", "causa_criterio": "monto_de_activos_bajo_umbral", "hecho_determinante": "El valor de los activos de la ACE transferidos a FARMAOYTE según los estados contables 2023 ($5.538.297.039) y el capital social de la nueva sociedad ($30.000.000) resultaron inferiores al umbral legal de minimis ($10.123.800.000 para 2024), y no hubo transacciones previas en el mismo mercado en los últimos 12 a 36 meses.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9 | Ley 27.442 art. 7", "precedentes": "OPI 177 | Concentración N° 177 - Dictamen N° 141", "parrafos": "57 | 58 | 59 | 60 | 61 | 62", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 7"]}, {"OPI": "371", "archivo": "OPI-371.pdf", "expediente": "EX-2024-126070135- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "BRINKS sostiene que la operación consistente en la adquisición del control exclusivo sobre DUCIT S.A. no se encuentra sujeta a la notificación obligatoria prevista en el artículo 9° de la LDC ya que le resultaría aplicable la excepción prevista en el artículo 11, inc. (e), de la LDC.", "argumento_consultante": "La operación cumple con los tres requisitos de la excepción de minimis: activos transferidos y valor local de la transacción por debajo del umbral, y ausencia de concentraciones económicas previas en el mismo mercado relevante en los últimos 36 meses.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Del análisis de la documentación aportada surge que se configuran simultáneamente los tres requisitos de la excepción de minimis: el valor de los activos transferidos en Argentina y el valor local de la transacción se encuentran por debajo del umbral de 20.000.000 de Unidades Móviles, y las partes no participaron en concentraciones económicas en el mismo mercado relevante en los últimos 36 meses.", "causa_criterio": "monto_de_activos_bajo_umbral", "hecho_determinante": "Los estados contables y documentación aportada acreditan que el valor de los activos transferidos (AR$ 5.547.826.282) y el valor local de la transacción (AR$ 5.298.651.696,33) son inferiores al umbral de 20.000.000 Unidades Móviles (AR$ 10.123.800.000), y las partes no participaron en concentraciones económicas en el mismo mercado relevante en los últimos 36 meses.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9", "precedentes": "", "parrafos": "16 | 17 | 18", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "373", "archivo": "OPI-373.pdf", "expediente": "EX-2023-14673705- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "La parte consultante entendió que la operación no se encuentra sujeta a la obligación de notificación conforme la normativa aplicable, dado que encuadra en las excepciones previstas en el artículo 11, incs. d) y e), de la Ley 27.442, toda vez que ALQA no habría realizado ninguna actividad económica en el año anterior y el monto de la operación y el valor de los activos no superaban el umbral legal vigente al momento del cierre.", "argumento_consultante": "El mercado relevante de la operación (simple propiedad minera) es distinto del mercado de derechos de exploración de litio involucrado en operaciones previas del grupo comprador, por lo que no corresponde sumar esos montos a los efectos del umbral del art. 11 inc. e), y además ALQA no registró actividad económica en el año anterior al cierre (art. 11 inc. d).", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442; comunicar que resulta de aplicación el punto a.1 de la Resolución 26/2006; y hacer saber que la opinión consultiva se emitió valorando como sustento fáctico la descripción realizada en los escritos del expediente.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "Los derechos mineros adquiridos con ALQA (simple propiedad minera sin DIA) constituyen un mercado relevante distinto al de los derechos de exploración minera que poseían las empresas adquiridas en operaciones previas del grupo comprador (Íntegra y Northern Lithium), por lo que esos montos previos no deben computarse a los efectos del umbral acumulado del art. 11 inc. e), y en consecuencia la operación en consulta no supera dicho umbral.", "causa_criterio": "monto_de_activos_bajo_umbral", "hecho_determinante": "ALQA no contaba, al momento del cierre, con ninguna Declaración de Impacto Ambiental (DIA) vigente que le permitiera explorar sus derechos mineros, a diferencia de las empresas adquiridas en las operaciones previas Íntegra y Northern Lithium, que sí poseían derechos de exploración de litio ya autorizados.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9 | Ley 27.442 art. 7 inc. c", "precedentes": "Conc. 1897 | Conc. 1898 | Conc. 1914 | Conc. 1917 | Conc. 1957", "parrafos": "80 | 81 | 82 | 83 | 84 | 85", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 7 inc. c"]}, {"OPI": "374", "archivo": "OPI-374.pdf", "expediente": "EX-2024-142741070- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "MOLINOS AGRO consultó si la adquisición de siete lotes de terreno en Timbúes y Puerto General San Martín, Provincia de Santa Fe, se encuentra sujeta a la obligación de notificación del artículo 9° de la Ley 27.442, solicitando además la suspensión del plazo previsto en dicho artículo.", "argumento_consultante": "Los inmuebles no constituyen una empresa ni una parte sustancial de ella, sino simples activos que no generan volumen de negocios ni clientela propia, por lo que no habría concentración económica en los términos de la ley.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9º de la Ley 27.442; comunicar a MOLINOS AGRO S.A. que resulta de aplicación el punto a.1 de la Resolución 26/2006 de la ex Secretaría de Coordinación Técnica.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "Los inmuebles constituyen una unidad de negocio y no meros activos, dado que el grupo comprador desarrolla actividad inmobiliaria (PAUEN S.A.) y agropecuaria (GOYAIKE), y con posterioridad al cierre los inmuebles fueron arrendados para siembra y cosecha, coincidiendo la actividad de la empresa objeto con la del adquirente, lo que impide aplicar la excepción del art. 11 inc. d).", "causa_criterio": "otro", "hecho_determinante": "Aunque los inmuebles no registraban actividad económica en el último año previo a la operación, el grupo comprador se dedica a actividad inmobiliaria y agropecuaria coincidente con la de la empresa objeto, y luego de la compra los terrenos fueron arrendados para producción agrícola, lo que configura continuidad de actividad y descarta la excepción por falta de actividad reciente.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9 | Ley 27.442 art. 11 inc. d", "precedentes": "OPI 83 | OPI 131 | OPI 361 | OPI 274", "parrafos": "29 | 41 | 42 | 43 | 44", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9", "Ley 27.442 art. 11 inc. d"]}, {"OPI": "375", "archivo": "OPI-375.pdf", "expediente": "EX-2025-00740811- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "Si el otorgamiento por tres años de derechos de acceso, prospección, exploración y compra sobre propiedades mineras en Santa Cruz a favor de CVSA constituye una concentración económica sujeta a notificación bajo el artículo 7° de la LDC.", "argumento_consultante": "Durante el período de opción de compra CVSA solo adquiere derechos limitados de exploración y prospección, sin derechos de explotación ni titularidad, sin cambio en la estructura de control, y aun si implicara algún control, este no sería perdurable en el tiempo.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta CNDC aconseja al Señor Secretario de Industria y Comercio disponer que la operación sujeta a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "CVSA solo adquiere un derecho de exploración que otorga una mera probabilidad de encontrar mineral, sin garantizar hallazgo ni extracción, careciendo de información sobre reservas comprobadas. Al excluirse expresamente el derecho de explotación y no transferirse la titularidad, no se produce un cambio de control ni una modificación duradera en la estructura de control de la empresa o sus activos.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El acuerdo otorga a CVSA únicamente derechos de exploración y prospección por 36 meses, excluyendo expresamente la explotación y la transferencia de titularidad, con MDN manteniéndose como titular durante todo el período de opción.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "CNDC, Control: Concepto y aplicación en defensa de la competencia, 2023", "parrafos": "25 | 26 | 29 | 30", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "376", "archivo": "OPI-376.pdf", "expediente": "EX-2025-21370000- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "SANTANDER sostiene que la operación de adquisición conjunta de control sobre ATI ARGENTINA no se encuentra sujeta a la notificación obligatoria del artículo 9° de la LDC, por resultarle aplicable la excepción de minimis prevista en el artículo 11, inc. e), de la LDC.", "argumento_consultante": "La consultante afirma que se cumplen los tres requisitos de la excepción de minimis: el valor de los activos transferidos en Argentina y el valor de la transacción están por debajo de los umbrales de 20.000.000 de Unidades Móviles, y no hubo concentraciones previas en el mismo mercado relevante en los últimos 36 meses.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Tanto el valor de los activos transferidos en Argentina como el valor total de la transacción se ubican por debajo del umbral de 20.000.000 de Unidades Móviles vigente a la fecha de cierre, y la adquirente no participó de concentraciones económicas en el mismo mercado relevante en los últimos 36 meses, configurándose así los tres requisitos simultáneos de la excepción de minimis.", "causa_criterio": "monto_de_activos_bajo_umbral", "hecho_determinante": "El valor de los activos transferidos (AR$ 3.113.430.000) y el valor de la transacción (US$ 10.000.000, equivalente a AR$ 10.805.000.000) se encuentran ambos por debajo del umbral de 20.000.000 Unidades Móviles (AR$ 22.045.600.000) calculado con el valor de unidad móvil vigente a la fecha de cierre.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9", "precedentes": "", "parrafos": "19 | 20 | 21", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9"]}, {"OPI": "377", "archivo": "OPI-377.pdf", "expediente": "EX-2025-21880905-APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Determinar si la adquisición del 15% de las acciones clase B de Southern Energy S.A. (SESA) por parte de YPF S.A. resulta sujeta a la obligación de notificación prevista en el artículo 9° de la Ley 27.442.", "argumento_consultante": "No existe toma de control conforme el artículo 7°, ya que tras la operación ningún accionista tiene por sí solo control societario ni influencia sustancial sobre SESA, tratándose de un escenario de mayorías cambiantes; subsidiariamente invoca la excepción del artículo 11 inc. e) por monto bajo el umbral.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta CNDC aconseja disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "El porcentaje de acciones adquirido por YPF (15%) no le otorga votos suficientes ni derechos de veto para incidir en decisiones de relevancia competitiva de SESA (designación de personal gerencial, presupuesto anual, plan de negocios), por lo que la toma de decisiones no requiere su voto positivo, no configurándose toma de control.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "Tras la operación, las participaciones accionarias de SESA quedaron distribuidas entre PAE (40%), PAMPA (20%), WDA (15%), YPF (15%) y GOLAR (10%), sin que la toma de decisiones de relevancia competitiva requiera el voto positivo de YPF.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "OPI 245 | OPI 124", "parrafos": "33 | 34 | 35 | 36", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "378", "archivo": "OPI-372.pdf", "expediente": "EX-2024-139539345- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la creación del joint venture VMOS S.A. para el desarrollo del Proyecto Vaca Muerta Sur, y la incorporación de sus sucesivos accionistas (YPF, PAMPA, PAE, VISTA, SHELL, CHEVRON, CDC y TECPETROL), constituye una concentración económica sujeta a notificación obligatoria.", "argumento_consultante": "Las partes sostuvieron que ninguna empresa accionista ejerce control ni influencia sustancial sobre VMOS, dado que ningún accionista dispone de las mayorías necesarias para adoptar o bloquear decisiones unilateralmente, y que VMOS es un vehículo sin actividad económica, activos ni clientes propios.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta COMISIÓN NACIONAL DE DEFENSA DE LA COMPETENCIA aconseja al SEÑOR SECRETARIO DE INDUSTRIA Y COMERCIO disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Ningún accionista adquiere control, ya que el porcentaje de acciones no otorga votos suficientes ni derechos de veto para influir en las decisiones. Además, VMOS no constituye una «empresa» en los términos del art. 7, al ser un vehículo greenfield sin actividad económica previa, activos operativos, volumen de negocios ni clientela propia.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "VMOS es una sociedad de reciente creación (proyecto greenfield) sin actividad económica previa, activos operativos, volumen de negocios independiente ni clientela, y su gobierno corporativo requiere mayorías (simple o del 70%/66%) que ningún accionista posee individualmente, impidiendo el control unilateral.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "OPI 124", "parrafos": "43 | 44 | 45 | 46", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "380", "archivo": "OPI-380.pdf", "expediente": "EX-2025-46434001- -APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "TETHER INVEST y ADECOAGRO consultaron si la adquisición del control exclusivo de ADECOAGRO por parte de TETHER INVEST se encuentra sujeta a la obligación de notificación del artículo 9 de la Ley 27.442, sosteniendo que encuadra en la excepción del artículo 11, inc. c).", "argumento_consultante": "La compradora es una empresa extranjera nueva en el mercado argentino, sin activos ni acciones previas relevantes en el país (salvo una participación minoritaria y no controlante del 20,40% sin influencia sustancial), por lo que la operación solo reemplaza un controlante por otro sin generar efectos anticompetitivos.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Disponer que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9 de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "La compradora, empresa extranjera sin control previo sobre el objeto ni activos o acciones relevantes en Argentina, solo poseía una participación minoritaria e indirecta sin influencia sustancial, y sus exportaciones al país (un contrato aislado) no fueron significativas, habituales ni frecuentes, por lo que la operación se limita a sustituir un controlante por otro sin efectos anticompetitivos.", "causa_criterio": "excepcion_primera_entrada_al_pais", "hecho_determinante": "TETHER INVEST, antes de la operación, solo tenía una participación indirecta y minoritaria (20,40%) sin control ni influencia sustancial sobre ADECOAGRO, no poseía otros activos en Argentina, y su único contacto comercial previo (un contrato de tokens con FINTECH S.A.) fue aislado, de impacto marginal (0,003% de ventas) y no habitual.", "fundamento_normativo": "Ley 27.442 art. 11 inc. c | Ley 27.442 art. 9 | Ley 27.442 art. 7", "precedentes": "", "parrafos": "33 | 34 | 35 | 36", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. c", "Ley 27.442 art. 9", "Ley 27.442 art. 7"]}, {"OPI": "381", "archivo": "OPI-381.pdf", "expediente": "EX-2025-63923480- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Las partes consultaron si la cesión de derechos, acciones y obligaciones sobre concesiones de exploración/explotación de petróleo crudo y/o gas natural y concesiones de transporte de YPF a FOMICRUZ se encuentra sujeta a la obligación de notificación del artículo 9° de la LDC.", "argumento_consultante": "La cesión a FOMICRUZ es transitoria (máximo 6 meses) y con destino a ser transferida a empresas continuadoras mediante licitación, por lo que no implica una toma de control duradera o permanente que permita calificarla como concentración económica.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas, esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "La operación fue diseñada ab initio como transitoria, con un plazo máximo de seis meses hasta la adjudicación a empresas continuadoras, y FOMICRUZ no asumió la operación de los activos —que permaneció a cargo de YPF durante la transición—, careciendo así de capacidad para gravitar sobre las decisiones competitivamente relevantes de los activos.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "FOMICRUZ ostentó la titularidad de los activos por un plazo máximo de seis meses, sin asumir su operación (que quedó a cargo de YPF), con el único fin de transferirlos a las empresas adjudicatarias de una licitación pública, las cuales efectivamente notificaron luego sus propias concentraciones ante la ANC.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 7 inc. d", "precedentes": "CONC 847 | OPI 177 | OPI 301 | CONC 1959 | CONC 1543 | OPI 138 | OPI 317 | OPI 363 | OPI 362 | OPI 369 | CONC 1340", "parrafos": "40 | 41 | 42 | 43", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 7 inc. d"]}, {"OPI": "383", "archivo": "OPI-383.pdf", "expediente": "EX-2023-99398685-APN-DR#CNDC", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "BUNGE solicita confirmar que la prórroga por 12 meses del Contrato de Fazón con RENOPACK, mediante el cual RENOPACK presta servicios de fraccionado y envasado de aceite refinado a granel utilizando el 100% de la capacidad de su planta, no queda sujeta a la notificación obligatoria del artículo 9° de la Ley 27.442.", "argumento_consultante": "La transacción solo implica la utilización de un activo aislado (la planta), sin que BUNGE adquiera control ni influencia sobre la política comercial de RENOPACK, ya que BUNGE aporta sus propios insumos, marcas y clientela, y RENOPACK conserva la titularidad y libre disposición de la planta, funcionando ambas empresas de forma separada e independiente.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "La operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "No hay transferencia de activos ni adquisición de influencia sustancial: BUNGE utiliza la planta de RENOPACK aportando sus propios insumos, marcas y clientela, mientras RENOPACK conserva la titularidad y libre disposición de la planta, funcionando ambas empresas de forma separada e independiente. La prórroga del contrato no altera este análisis previo.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "El Contrato de Fazón entre BUNGE y RENOPACK implica únicamente la utilización de la planta de RENOPACK para fraccionado y envasado, con insumos, marcas y clientela propios de BUNGE, sin que RENOPACK tenga injerencia sobre la política comercial de BUNGE ni viceversa, y su prórroga por 12 meses no modifica esa situación.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 7 inc. d | Ley 27.442 art. 7 inc. e", "precedentes": "OPI 358", "parrafos": "25 | 26 | 28", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 7 inc. e"]}, {"OPI": "385", "archivo": "OPI-385.pdf", "expediente": "EX-2017-29133916- -APN-DDYME#MP,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "La parte consultante entiende que la operación no se encuentra sujeta a la obligación de notificación prevista en el artículo 9° de la LDC, toda vez que considera que la toma de control no tiene carácter de permanente, ya que depende del resultado de un Concurso Público.", "argumento_consultante": "La toma de control carece de permanencia porque su carácter definitivo depende del resultado de un Concurso Público aún no resuelto, pudiendo implicar un cambio de control temporario sin efectos en el mercado relevante.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "El cambio de control no tiene un plazo determinado ni un mecanismo de reversión cierto: depende del resultado incierto de un Concurso Público, y aun si el Comprador no resultara adjudicatario, no se compromete a restituir la totalidad de los activos, conservando el negocio hidroeléctrico de OECC. A diferencia de precedentes donde el adquirente actuaba como mero vehículo transitorio, aquí adquiere el control con vocación de retenerlo, por lo que no puede calificarse la operación como transitoria.", "causa_criterio": "otro", "hecho_determinante": "El Comprador ya adquirió el control conjunto de OEGSA y OECC mediante contratos de compraventa de acciones perfeccionados, y la eventual restitución de OEGSA solo ocurriría en un escenario contingente e incierto, sin compromiso firme de reversión, conservando en todo caso el control sobre OECC.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 11", "precedentes": "OPI 138 | CONC 1543 | OPI 301 | OPI 362 | OPI 363 | OPI 369 | CONC 847 | OPI 317 | OPI 381", "parrafos": "37 | 38 | 39 | 40 | 41 | 42 | 43 | 44 | 46", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 11"]}, {"OPI": "386", "archivo": "OPI-386.pdf", "expediente": "EX-2025-122973696- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Se consulta si la fusión por absorción de DASS SUAREZ S.A. (absorbida) por parte de DASS ELDORADO S.R.L. (absorbente) se encuentra sujeta a la obligación de notificación del artículo 9° de la LDC, dado que la parte consultante entiende que no implica cambio de control en los términos del artículo 7° de la LDC.", "argumento_consultante": "La operación no tiene por efecto un cambio de control, ya que luego de la fusión el 100% del capital de la absorbente seguirá conformado por los mismos controlantes (DASS NORDESTE y, en última instancia, BLU LICENCIAMENTOS E PARTICIPAÇÕES S/A), sin que se modifique ni el controlante final ni el intermedio.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "La absorbente y la absorbida estaban controladas, antes y después de la operación, por el mismo grupo económico (DASS NORDESTE y, en última instancia, BLU LICENCIAMENTOS E PARTICIPAÇÕES S/A), por lo que no se verifica una toma de control por un nuevo grupo económico sino una reorganización societaria intragrupo.", "causa_criterio": "reorganizacion_intragrupo_sin_cambio_de_control", "hecho_determinante": "Los controlantes de la absorbente y la absorbida, tanto el inmediato (DASS NORDESTE) como el final (BLU LICENCIAMENTOS E PARTICIPAÇÕES S/A), continúan siendo los mismos antes y después de la fusión por absorción.", "fundamento_normativo": "Ley 27.442 art. 7 | Ley 27.442 art. 9", "precedentes": "", "parrafos": "16 | 17 | 18 | 19 | 20", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7", "Ley 27.442 art. 9"]}, {"OPI": "387", "archivo": "OPI-387.pdf", "expediente": "EX-2025-126553207- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "Consulta sobre la operación consistente en el otorgamiento a LRSA, por parte del GCBA, de la concesión de obra pública para el diseño, construcción, mantenimiento, uso y explotación comercial del predio Centro Costa Salguero (CCS) por 10 años.", "argumento_consultante": "La consultante solicitó suspender los plazos hasta que se resolvieran los recursos administrativos interpuestos contra la adjudicación de la concesión a un tercero, por tratarse de una situación de control hipotética y controvertida.", "respuesta_sentido": "archivo", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que corresponde disponer el archivo de las actuaciones que tramitan bajo expediente EX-2025-126553207- -APN-DR#CNDC, caratulado: “LA RURAL SA S/ OPINION CONSULTIVA ART. 10º DE LA LEY 27.442 (OPI 387)”.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La concesión que motivó la consulta fue adjudicada a un tercero, por lo que la operación devino abstracta; mantener suspendido el procedimiento sin plazo cierto hasta la resolución de los recursos administrativos no responde a ninguna finalidad administrativa.", "causa_criterio": "operacion_no_perfeccionada_o_desistida", "hecho_determinante": "La licitación por la concesión del predio Centro Costa Salguero fue adjudicada a un tercero distinto de LRSA, quien interpuso recursos administrativos aún no resueltos.", "fundamento_normativo": "Ley 27.442 art. 9 | Ley 27.442 art. 31 inc. a", "precedentes": "", "parrafos": "15 | 16 | 17", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 9", "Ley 27.442 art. 31 inc. a"]}, {"OPI": "388", "archivo": "OPI-388.pdf", "expediente": "EX-2025-128881637- -APN-DR#CNDC,", "ley": "25.156 | 27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La parte consultante plantea si la enmienda al Acuerdo de Accionistas de CITELEC, suscripta el 12 de noviembre de 2025 entre PAMPA y EA, implica un cambio de control de CITELEC o constituye una nueva operación de concentración económica sujeta a notificación obligatoria.", "argumento_consultante": "La enmienda no implica cambio de control de CITELEC ni constituye una nueva operación de concentración económica, ya que la estructura accionaria y el control conjunto entre PAMPA y EA permanecen inalterados, tratándose de modificaciones de naturaleza contractual y operativa.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas, esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "No existe modificación en la estructura accionaria ni en el control conjunto de CITELEC, que sigue siendo ejercido en partes iguales por PAMPA y EA sin que ninguna adquiera derechos de veto adicionales o mayorías especiales; las modificaciones son de orden contractual y operativo, sin impacto en la estructura de control ni en la competencia de los mercados relevantes.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "La enmienda al Acuerdo de Accionistas solo eliminó derechos de preferencia y tag-along y ajustó la designación de un director suplente, sin alterar la tenencia accionaria (50%-50%) ni el control conjunto preexistente entre PAMPA y EA sobre CITELEC.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "Resolución (ex) SCT 90/2004 | Concentración Económica N° 462 | Concentración Económica N° 450", "parrafos": "23 | 24 | 26 | 27", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "389", "archivo": "OPI-389.pdf", "expediente": "EX-2025-100223122- -APN-DR#CN", "ley": "27.442", "pregunta_tipo": "aplicacion_de_excepcion", "pregunta_texto": "CO DESARROLLO y LATAM consultan si la Operación (adquisición de INTERSERVI y NOROESTE CONSTRUCTORA, con control conjunto sobre FARADAY y ALTATENSIÓN) y la transacción bajo análisis en la Conc. 2058 (control conjunto de TRANSNOA y TRANSNEA) tratan sobre un mismo mercado, a fin de determinar la aplicación de la excepción de minimis del art. 11 inc. e) de la LDC.", "argumento_consultante": "El monto de la operación y el valor de los activos adquiridos están por debajo del umbral del art. 11 inc. e), y los mercados de las operaciones previas (Conc. 2058, transporte de energía eléctrica) difieren del mercado de la Operación bajo consulta (fabricación de equipos de transformación eléctrica), por lo que no correspondería acumular montos y sería aplicable la excepción de minimis.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "En base a las consideraciones expuestas, esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "Existe una vinculación vertical directa y específica entre los mercados afectados por la Operación y por la Conc. 2058: los transformadores fabricados por FARADAY y ALTATENSIÓN son un insumo crítico y específico para TRANSNOA y TRANSNEA, integrando una misma cadena de valor. Ello impide considerar que se trata de mercados ajenos entre sí, por lo que corresponde acumular los montos de ambas operaciones, superándose así los umbrales del art. 11 inc. e), lo que torna inaplicable la excepción de minimis.", "causa_criterio": "otro", "hecho_determinante": "Los equipos de transformación de alta y extra alta tensión fabricados por FARADAY y ALTATENSIÓN constituyen un componente crítico y específico de la infraestructura de transporte de energía eléctrica que prestan TRANSNOA y TRANSNEA (empresas controladas mediante la Conc. 2058 por el mismo grupo adquirente dentro de los 12 meses previos), configurando una vinculación vertical directa que obliga a acumular los montos de ambas operaciones.", "fundamento_normativo": "Ley 27.442 art. 11 inc. e | Ley 27.442 art. 9 | Ley 27.442 art. 7", "precedentes": "Conc. 2058", "parrafos": "42 | 43 | 44 | 45 | 46 | 47", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 11 inc. e", "Ley 27.442 art. 9", "Ley 27.442 art. 7"]}, {"OPI": "390", "archivo": "OPI-390.pdf", "expediente": "EX-2025-134956580- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La parte consultante entendió que la operación no se encuentra sujeta a la obligación de notificación prevista en el artículo 9° de la LDC porque BPPNA y PIONEER solo contribuyen capital y know how a CORTEVA BP, por lo que esta calificaría como greenfield.", "argumento_consultante": "BPPNA y PIONEER manifestaron que no contribuirán ninguna actividad comercial existente a CORTEVA BP, por lo que no existe transferencia ni cambio de control sobre un negocio preexistente, tratándose de una sociedad greenfield.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "La operación no encuadra en el concepto de concentración económica del artículo 7° de la LDC porque CORTEVA BP es una sociedad de reciente creación (greenfield), sin actividad económica previa, activos operativos, volumen de negocios independiente ni clientela propia; los aportes de capital y know how de las partes no constituyen «activos de una empresa» preexistente.", "causa_criterio": "otro", "hecho_determinante": "CORTEVA BP fue constituida específicamente como vehículo societario para un nuevo proyecto (comercialización de materia prima oleaginosa para biocombustible de aviación), sin contar con activos productivos, marcas, patentes, clientela o volumen de negocios propio; solo se aportó capital y know how por parte de BPPNA y PIONEER.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "OPI 372", "parrafos": "17 | 18 | 19 | 20", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "391", "archivo": "OPI-391.pdf", "expediente": "EX-2020-62069186- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "encuadre_como_concentracion", "pregunta_texto": "La parte consultante entendió que la operación no se encuentra sujeta a la obligación de notificación prevista en el artículo 9° de la LDC porque SANTA FE BIO calificaría como greenfield, al no ser una empresa activa en el mercado sino un vehículo constituido para llevar adelante el Proyecto SAF.", "argumento_consultante": "SANTA FE BIO no tiene actividad económica, activos operativos, clientes ni volumen de negocios independiente; es un vehículo greenfield sin transferencia de activos de una empresa preexistente.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "", "CAUSA_ratio_decidendi": "Los aportes de YPF (un inmueble no operativo, sin instalaciones ni capacidad productiva) y de ESSENTIAL (una planta de pretratamiento aún en fabricación, no montada) no constituyen activos de una empresa preexistente activa en el mercado, ni se transfieren marcas, patentes, clientela o contratos que permitan el desarrollo actual de una actividad económica.", "causa_criterio": "ausencia_de_control_o_influencia_sustancial | otro", "hecho_determinante": "SANTA FE BIO es una sociedad de reciente creación constituida como vehículo greenfield para el Proyecto SAF, sin actividad económica previa, y los aportes de sus accionistas (inmueble no operativo y planta en fabricación) no constituyen activos de una empresa preexistente en los términos del artículo 7° de la LDC.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "OPI 372 | CONC 1732", "parrafos": "23 | 24 | 25 | 32 | 33", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "392", "archivo": "OPI-392.pdf", "expediente": "EX-2025-144358655- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "BUNGE consulta si la operación, ya concretada, consistente en un MOU sobre el uso de ciertos activos de VICENTIN celebrado con GRUPO GRASSI, se encuentra sujeta a la obligación de notificación del artículo 9° de la LDC.", "argumento_consultante": "BUNGE sostiene que el MOU no constituye una transferencia de activos, ya que estos continúan siendo de titularidad de VICENTIN, controlada por GRUPO GRASSI, y BUNGE carecería de cualquier decisión sobre la estrategia competitiva de dichos activos.", "respuesta_sentido": "sujeta_a_notificacion", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "El MOU otorga a BUNGE derechos de uso exclusivo y prioritario sobre una porción significativa de la capacidad instalada de VICENTIN en múltiples plantas y terminales portuarias por cinco años, con cláusulas de exclusividad que impiden a GRUPO GRASSI ceder la capacidad ociosa a terceros. Ello configura una transferencia fáctica del uso de activos empresariales que otorga a BUNGE influencia determinante sobre decisiones de administración ordinaria de VICENTIN respecto de su capacidad instalada.", "causa_criterio": "otro", "hecho_determinante": "El MOU concede a BUNGE derechos de uso exclusivo y preferente sobre porcentajes relevantes de molienda, refinado, producción de biodiesel y capacidad portuaria de VICENTIN en cinco plantas, por cinco años, impidiendo a GRUPO GRASSI ceder la capacidad no utilizada a terceros distintos de BUNGE, lo que excede un mero acuerdo de fasón.", "fundamento_normativo": "Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "OPI 132 | OPI 148 | OPI 182 | OPI 129", "parrafos": "15 | 16 | 17 | 18 | 19 | 20 | 21 | 23", "confianza": "alta", "alertas_automaticas": "criterio = otro", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}, {"OPI": "393", "archivo": "OPI-393.pdf", "expediente": "EX-2026-32772601- -APN-DR#CNDC,", "ley": "27.442", "pregunta_tipo": "obligacion_de_notificar", "pregunta_texto": "La parte consultante entendió que la operación no se encuentra sujeta a la obligación de notificación prevista en el artículo 9° de la LDC, dado que no existe toma de control, SMP no cuenta con activos, no se supera el umbral del artículo 11 inciso e), y la construcción del gasoducto se desarrollará desde cero sin transferencia de activos productivos.", "argumento_consultante": "No hay toma de control de una empresa preexistente porque SMP carece de activos y la operación implica la construcción desde cero de un gasoducto, sin transferencia de activos, empresas o unidades de negocio.", "respuesta_sentido": "no_sujeta_a_notificacion", "respuesta_texto": "Esta SECRETARÍA DE CONCENTRACIONES ECONÓMICAS opina que la operación traída a consulta no se encuentra sujeta a la obligación de notificación establecida en el artículo 9° de la Ley 27.442.", "medidas_accesorias": "remision", "CAUSA_ratio_decidendi": "SMP es un mero vehículo societario sin activos ni actividad económica previa, por lo que la venta de sus acciones no implica la toma de control de una «empresa» preexistente en los términos del artículo 7° de la LDC, sino la constitución de un emprendimiento conjunto para un negocio nuevo (greenfield).", "causa_criterio": "ausencia_de_control_o_influencia_sustancial", "hecho_determinante": "SMP no contaba con ningún activo previo a la operación, y la construcción del gasoducto se desarrollará desde cero, sin transferencia de activos productivos, empresas ni unidades de negocio entre los socios.", "fundamento_normativo": "Ley 27.442 art. 7 inc. c | Ley 27.442 art. 7 inc. d | Ley 27.442 art. 9", "precedentes": "OPI 372", "parrafos": "20 | 21 | 22 | 23 | 24 | 25", "confianza": "alta", "alertas_automaticas": "", "VAL_ok (s/n)": "", "VAL_causa_corregida": "", "VAL_notas": "", "normas_lista": ["Ley 27.442 art. 7 inc. c", "Ley 27.442 art. 7 inc. d", "Ley 27.442 art. 9"]}];
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const split = s => (s||'').split('|').map(x=>x.trim()).filter(Boolean);

DATA.forEach(d=>{ d._blob = norm([d.OPI,d.expediente,d.ley,d.pregunta_tipo,d.pregunta_texto,d.argumento_consultante,
  d.respuesta_sentido,d.respuesta_texto,d.medidas_accesorias,d.CAUSA_ratio_decidendi,d.causa_criterio,
  d.hecho_determinante,d.fundamento_normativo,d.precedentes,(d.normas_lista||[]).join(' ')].join(' ')); });

function fill(sel, vals){ vals.sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>{
  const o=document.createElement('option'); o.value=v; o.textContent=v; $(sel).appendChild(o); }); }
const uniq = f => [...new Set(DATA.flatMap(f))];
fill('#f-sent', uniq(d=>split(d.respuesta_sentido)));
fill('#f-tipo', uniq(d=>split(d.pregunta_tipo)));
fill('#f-crit', uniq(d=>split(d.causa_criterio)));
fill('#f-ley',  uniq(d=>split(d.ley)));
$('#tot').textContent = DATA.length + ' dictámenes';

function hl(txt, terms){
  let h = esc(txt||'');
  terms.forEach(t=>{ if(t.length<2) return;
    h = h.replace(new RegExp('('+t.replace(/[^\p{L}\p{N}]/gu, m => '\\' + m)+')','gi'),'<mark>$1</mark>'); });
  return h;
}
function field(label, val, terms){
  if(!val) return '';
  return `<div class="f"><h3>${label}</h3><p>${hl(val,terms)}</p></div>`;
}
function listField(label, arr, terms){
  if(!arr || !arr.length) return '';
  return `<div class="f"><h3>${label}</h3><ul>${arr.map(x=>`<li>${hl(x,terms)}</li>`).join('')}</ul></div>`;
}

function render(){
  const raw = $('#q').value.trim();
  const terms = raw ? raw.split(/\s+/) : [];
  const nterms = terms.map(norm);
  const fs=$('#f-sent').value, ft=$('#f-tipo').value, fc=$('#f-crit').value, fl=$('#f-ley').value;
  const res = DATA.filter(d =>
    nterms.every(t => d._blob.includes(t)) &&
    (!fs || split(d.respuesta_sentido).includes(fs)) &&
    (!ft || split(d.pregunta_tipo).includes(ft)) &&
    (!fc || split(d.causa_criterio).includes(fc)) &&
    (!fl || split(d.ley).includes(fl))
  );
  $('#count').textContent = res.length + (res.length===1?' resultado':' resultados');
  $('#list').innerHTML = res.length ? res.map(d=>`
    <div class="card">
      <div class="head">
        <div class="num">OPI ${esc(d.OPI)}<small>${esc(d.confianza)}</small></div>
        <div class="summary">
          <p class="preg">${hl(d.pregunta_texto,terms)}</p>
          <div class="tags">
            ${split(d.respuesta_sentido).map(x=>`<span class="tag s">${esc(x)}</span>`).join('')}
            ${split(d.pregunta_tipo).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
            ${split(d.ley).map(x=>`<span class="tag">Ley ${esc(x)}</span>`).join('')}
            ${d.expediente?`<span class="tag">${esc(d.expediente)}</span>`:''}
          </div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="body">
        ${field('Argumento del consultante', d.argumento_consultante, terms)}
        ${field('Respuesta de la CNDC', d.respuesta_texto, terms)}
        ${field('Medidas accesorias', d.medidas_accesorias.replace(/\|/g,' · '), terms)}
        ${field('Ratio decidendi', d.CAUSA_ratio_decidendi, terms)}
        ${field('Criterio', d.causa_criterio.replace(/\|/g,' · '), terms)}
        ${field('Hecho determinante', d.hecho_determinante, terms)}
        ${field('Fundamento normativo', d.fundamento_normativo.replace(/\|/g,' · '), terms)}
        ${listField('Precedentes citados', split(d.precedentes), terms)}
        ${listField('Normas invocadas', d.normas_lista, terms)}
        ${field('Párrafos fuente', d.parrafos.replace(/\|/g,', '), terms)}
        ${field('Archivo', d.archivo, terms)}
      </div>
    </div>`).join('') : '<div class="empty">Sin resultados. Probá con otros términos o limpiá los filtros.</div>';
}
$('#list').addEventListener('click', e=>{
  const h = e.target.closest('.head'); if(h) h.parentElement.classList.toggle('open');
});
['#q','#f-sent','#f-tipo','#f-crit','#f-ley'].forEach(s=>$(s).addEventListener('input',render));
render();
</script>
</body>
</html>
